# ─────────────────────────────────────────────────────────────
# Overrides de PRODUCCIÓN (VPS detrás de Cloudflare Tunnel).
# Uso:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# El endurecimiento (read_only, cap_drop, redes, límites) está en el docker-compose.yml
# base → se aplica igual en local y en el VPS. Aquí solo lo propio de producción.
# ─────────────────────────────────────────────────────────────

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"   # que los logs no llenen el disco
      max-file: "3"

services:
  # El healthcheck de la app viene de la imagen (HEALTHCHECK con Python, sin curl)
  app:
    <<: *logging

  redis:
    <<: *logging

  sqlserver:
    <<: *logging
    environment:
      # 3,8 GB de RAM en el VPS → tope para que SQL Server no se lo coma todo
      MSSQL_MEMORY_LIMIT_MB: "2048"
    # Tope duro del contenedor algo por encima del de SQL Server (procesos auxiliares)
    mem_limit: 2304m
    memswap_limit: 2304m

  worker-1:
    <<: *logging

  # Con la RAM del VPS basta 1 worker. Para activarlo: --profile extra
  worker-2:
    profiles: ["extra"]

  nginx:
    <<: *logging
    depends_on:
      app:
        condition: service_healthy
