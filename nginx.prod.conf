# Redirige HTTP → HTTPS (ambos dominios)
server {
    listen 80;
    server_name panchibot.es www.panchibot.es;
    return 301 https://www.panchibot.es$request_uri;
}

# Redirige el apex sin www → www (HTTPS)
server {
    listen 443 ssl;
    server_name panchibot.es;

    ssl_certificate     /etc/letsencrypt/live/panchibot.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panchibot.es/privkey.pem;

    return 301 https://www.panchibot.es$request_uri;
}

# Servidor principal HTTPS
server {
    listen 443 ssl;
    server_name www.panchibot.es;

    # Certificado (certbot genera uno válido para ambos dominios si usas -d panchibot.es -d www.panchibot.es)
    ssl_certificate     /etc/letsencrypt/live/panchibot.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panchibot.es/privkey.pem;

    # Protocolos y cifrados seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Sesión SSL (mejora rendimiento en reconexiones)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS: obliga HTTPS durante 1 año en el navegador
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /health {
        proxy_pass http://app:5000/health;
        access_log off;
    }

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
