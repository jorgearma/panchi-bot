services:
  app:
    build: .
    expose:
      - "5000"
    env_file: .env
    environment:
      - TZ=Europe/Madrid
    depends_on:
      redis:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SQL_PWD}"
      MSSQL_PID: Express
    expose:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
      - ./migrations:/migrations:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_PWD}", "-Q", "SELECT 1", "-No"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Worker 1: Load balancing (escucha todas las colas)
  worker-1:
    build: .
    command: python worker.py
    env_file: .env
    environment:
      - TZ=Europe/Madrid
    depends_on:
      redis:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # Worker 2: Load balancing (escucha todas las colas)
  # Se balancean automáticamente: si worker-1 está ocupado, worker-2 ayuda
  worker-2:
    build: .
    command: python worker.py
    env_file: .env
    environment:
      - TZ=Europe/Madrid
    depends_on:
      redis:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./${NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  sqlserver_data:
