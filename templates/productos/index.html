<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panchi — Productos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .fade-in { animation: fadeIn .2s ease-in; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    input[type=number]::-webkit-inner-spin-button { opacity: 1; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800" x-data="productos()" x-init="init()">

  <!-- NAVBAR -->
  <nav class="bg-gray-900 text-white px-6 py-3 flex items-center justify-between shadow">
    <div class="flex items-center gap-4">
      <a href="/dashboard" class="text-gray-400 hover:text-white transition text-sm">← Dashboard</a>
      <span class="text-xl font-bold">📦 Gestión de productos</span>
    </div>
    <div class="flex items-center gap-3 text-sm">
      <span class="text-gray-400" x-text="lista.length + ' productos'"></span>
      <button @click="cargar()"
              class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg transition">
        ↻ Actualizar
      </button>
    </div>
  </nav>

  <!-- FILTROS -->
  <div class="bg-white border-b border-gray-200 px-6 py-3 flex flex-wrap items-center gap-3">
    <!-- Búsqueda -->
    <div class="relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">🔍</span>
      <input x-model="busqueda"
             type="text"
             placeholder="Buscar producto..."
             class="pl-8 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 w-56" />
    </div>

    <!-- Filtro categoría -->
    <select x-model="filtroCategoria"
            class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white">
      <option value="">Todas las categorías</option>
      <template x-for="cat in categorias" :key="cat">
        <option :value="cat" x-text="cat"></option>
      </template>
    </select>

    <!-- Filtro disponibilidad -->
    <select x-model="filtroDisponible"
            class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white">
      <option value="">Todos</option>
      <option value="disponible">Disponibles</option>
      <option value="no_disponible">No disponibles</option>
      <option value="sin_stock">Sin stock</option>
      <option value="stock_bajo">Stock bajo (≤5)</option>
    </select>

    <!-- Resumen rápido -->
    <div class="ml-auto flex gap-4 text-sm">
      <span class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-green-500"></span>
        <span class="text-gray-600" x-text="resumen.disponibles + ' disponibles'"></span>
      </span>
      <span class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>
        <span class="text-gray-600" x-text="resumen.stockBajo + ' stock bajo'"></span>
      </span>
      <span class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
        <span class="text-gray-600" x-text="resumen.sinStock + ' sin stock'"></span>
      </span>
    </div>
  </div>

  <!-- TABLA -->
  <div class="p-6">
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200 text-xs text-gray-500 uppercase tracking-wide">
            <th class="text-left px-4 py-3">Producto</th>
            <th class="text-left px-4 py-3 hidden md:table-cell">Categoría</th>
            <th class="text-left px-4 py-3 hidden lg:table-cell">Ubicación</th>
            <th class="text-center px-4 py-3">Stock</th>
            <th class="text-center px-4 py-3">Disponible</th>
            <th class="text-right px-4 py-3">Precio</th>
          </tr>
        </thead>
        <tbody>
          <!-- Cargando -->
          <tr x-show="cargando">
            <td colspan="6" class="px-4 py-10 text-center text-gray-400">
              <div class="flex items-center justify-center gap-2">
                <div class="w-5 h-5 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></div>
                Cargando productos...
              </div>
            </td>
          </tr>

          <!-- Sin resultados -->
          <tr x-show="!cargando && productosFiltrados.length === 0">
            <td colspan="6" class="px-4 py-10 text-center text-gray-400">
              No hay productos que coincidan con los filtros
            </td>
          </tr>

          <!-- Filas -->
          <template x-for="p in productosFiltrados" :key="p.id">
            <tr class="border-b border-gray-100 hover:bg-gray-50 transition fade-in"
                :class="!p.disponible ? 'opacity-60' : ''">

              <!-- Nombre -->
              <td class="px-4 py-3">
                <div class="font-medium text-gray-900" x-text="p.nombre"></div>
                <div x-show="p.descripcion"
                     class="text-xs text-gray-400 truncate max-w-xs mt-0.5"
                     x-text="p.descripcion"></div>
              </td>

              <!-- Categoría -->
              <td class="px-4 py-3 hidden md:table-cell">
                <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full"
                      x-text="p.categoria"></span>
              </td>

              <!-- Ubicación almacén -->
              <td class="px-4 py-3 hidden lg:table-cell">
                <span x-show="p.ubicacion" class="text-xs text-gray-500 font-mono bg-gray-100 px-2 py-1 rounded"
                      x-text="p.ubicacion"></span>
                <span x-show="!p.ubicacion" class="text-gray-300 text-xs">—</span>
              </td>

              <!-- Stock — controles inline -->
              <td class="px-4 py-3 text-center">
                <div class="flex items-center justify-center gap-1.5">
                  <button @click="ajustarStock(p, -1)"
                          :disabled="p.stock <= 0 || p._guardando"
                          class="w-7 h-7 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-100 disabled:opacity-30 disabled:cursor-not-allowed transition font-bold text-base leading-none flex items-center justify-center">
                    −
                  </button>

                  <input type="number"
                         :value="p.stock"
                         @change="setStock(p, $event.target.value)"
                         @focus="$event.target.select()"
                         min="0"
                         :disabled="p._guardando"
                         class="w-14 text-center border border-gray-200 rounded-lg py-1 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-300 disabled:opacity-50"
                         :class="stockClass(p.stock)" />

                  <button @click="ajustarStock(p, +1)"
                          :disabled="p._guardando"
                          class="w-7 h-7 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-100 disabled:opacity-30 disabled:cursor-not-allowed transition font-bold text-base leading-none flex items-center justify-center">
                    +
                  </button>

                  <!-- Badge stock -->
                  <span class="text-xs px-1.5 py-0.5 rounded-full font-medium ml-1"
                        :class="{
                          'bg-red-100 text-red-700':    p.stock === 0,
                          'bg-yellow-100 text-yellow-700': p.stock > 0 && p.stock <= 5,
                          'bg-green-100 text-green-700':   p.stock > 5,
                        }"
                        x-text="p.stock === 0 ? 'Vacío' : p.stock <= 5 ? 'Bajo' : 'OK'">
                  </span>
                </div>
              </td>

              <!-- Disponible — toggle -->
              <td class="px-4 py-3 text-center">
                <button @click="toggleDisponible(p)"
                        :disabled="p._guardando"
                        class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none disabled:opacity-50"
                        :class="p.disponible ? 'bg-green-500' : 'bg-gray-300'">
                  <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                        :class="p.disponible ? 'translate-x-6' : 'translate-x-1'"></span>
                </button>
              </td>

              <!-- Precio — edición inline -->
              <td class="px-4 py-3 text-right">
                <div x-show="!p._editandoPrecio"
                     @dblclick="p._editandoPrecio = true; p._precioTemp = p.precio"
                     class="font-semibold text-gray-900 cursor-pointer hover:text-blue-600 transition"
                     :title="'Doble click para editar'"
                     x-text="p.precio.toFixed(2) + ' €'">
                </div>
                <div x-show="p._editandoPrecio" x-cloak class="flex items-center justify-end gap-1">
                  <input type="number"
                         x-model="p._precioTemp"
                         step="0.01"
                         min="0.01"
                         @keydown.enter="guardarPrecio(p)"
                         @keydown.escape="p._editandoPrecio = false"
                         @focus="$event.target.select()"
                         class="w-20 text-right border border-blue-300 rounded-lg py-1 px-2 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-300" />
                  <button @click="guardarPrecio(p)"
                          class="text-green-600 hover:text-green-700 font-bold text-lg leading-none">✓</button>
                  <button @click="p._editandoPrecio = false"
                          class="text-gray-400 hover:text-gray-600 text-lg leading-none">✕</button>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- Pie de tabla -->
    <div x-show="productosFiltrados.length > 0"
         class="mt-3 text-xs text-gray-400 text-center"
         x-text="productosFiltrados.length + ' de ' + lista.length + ' productos mostrados'">
    </div>
  </div>

  <!-- TOAST -->
  <div x-show="toast.visible" x-cloak
       class="fixed bottom-6 right-6 z-50 fade-in">
    <div class="rounded-xl px-5 py-3 shadow-xl text-sm font-medium text-white flex items-center gap-2"
         :class="toast.error ? 'bg-red-600' : 'bg-gray-900'">
      <span x-text="toast.error ? '✗' : '✓'"></span>
      <span x-text="toast.msg"></span>
    </div>
  </div>

  <script>
    function productos() {
      return {
        lista: [],
        cargando: false,
        busqueda: '',
        filtroCategoria: '',
        filtroDisponible: '',
        toast: { visible: false, msg: '', error: false },

        get categorias() {
          return [...new Set(this.lista.map(p => p.categoria))].sort();
        },

        get productosFiltrados() {
          return this.lista.filter(p => {
            if (this.busqueda) {
              const q = this.busqueda.toLowerCase();
              if (!p.nombre.toLowerCase().includes(q) &&
                  !(p.descripcion || '').toLowerCase().includes(q)) return false;
            }
            if (this.filtroCategoria && p.categoria !== this.filtroCategoria) return false;
            if (this.filtroDisponible === 'disponible'    && !p.disponible)    return false;
            if (this.filtroDisponible === 'no_disponible' && p.disponible)     return false;
            if (this.filtroDisponible === 'sin_stock'     && p.stock > 0)      return false;
            if (this.filtroDisponible === 'stock_bajo'    && p.stock > 5)      return false;
            return true;
          });
        },

        get resumen() {
          return {
            disponibles: this.lista.filter(p => p.disponible).length,
            sinStock:    this.lista.filter(p => p.stock === 0).length,
            stockBajo:   this.lista.filter(p => p.stock > 0 && p.stock <= 5).length,
          };
        },

        async init() {
          await this.cargar();
        },

        async cargar() {
          this.cargando = true;
          try {
            const r = await fetch('/productos-admin/lista');
            if (r.ok) {
              const data = await r.json();
              // Add UI state fields without reactivity issues
              this.lista = data.map(p => ({
                ...p,
                _guardando: false,
                _editandoPrecio: false,
                _precioTemp: p.precio,
              }));
            }
          } finally {
            this.cargando = false;
          }
        },

        async ajustarStock(p, delta) {
          p._guardando = true;
          try {
            const r = await fetch(`/productos-admin/${p.id}/stock`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ delta }),
            });
            const data = await r.json();
            if (r.ok) {
              p.stock = data.stock;
              if (p.stock === 0) p.disponible = false;
              if (delta > 0 && p.stock > 0) p.disponible = true;
            } else {
              this.mostrarToast(data.error, true);
            }
          } finally {
            p._guardando = false;
          }
        },

        async setStock(p, valor) {
          const nuevo = parseInt(valor);
          if (isNaN(nuevo) || nuevo < 0) return;
          p._guardando = true;
          try {
            const r = await fetch(`/productos-admin/${p.id}/stock`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ stock: nuevo }),
            });
            const data = await r.json();
            if (r.ok) {
              p.stock = data.stock;
              if (p.stock === 0) p.disponible = false;
              else p.disponible = true;
              this.mostrarToast(`Stock actualizado: ${p.stock} unidades`);
            } else {
              this.mostrarToast(data.error, true);
            }
          } finally {
            p._guardando = false;
          }
        },

        async toggleDisponible(p) {
          p._guardando = true;
          const nuevo = !p.disponible;
          try {
            const r = await fetch(`/productos-admin/${p.id}/disponible`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ disponible: nuevo }),
            });
            const data = await r.json();
            if (r.ok) {
              p.disponible = data.disponible;
              this.mostrarToast(p.disponible ? `${p.nombre} activado` : `${p.nombre} desactivado`);
            } else {
              this.mostrarToast(data.error, true);
            }
          } finally {
            p._guardando = false;
          }
        },

        async guardarPrecio(p) {
          const nuevo = parseFloat(p._precioTemp);
          if (isNaN(nuevo) || nuevo <= 0) {
            this.mostrarToast('Precio inválido', true);
            return;
          }
          p._guardando = true;
          try {
            const r = await fetch(`/productos-admin/${p.id}/precio`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ precio: nuevo }),
            });
            const data = await r.json();
            if (r.ok) {
              p.precio = data.precio;
              p._editandoPrecio = false;
              this.mostrarToast(`Precio actualizado: ${p.precio.toFixed(2)}€`);
            } else {
              this.mostrarToast(data.error, true);
            }
          } finally {
            p._guardando = false;
          }
        },

        stockClass(stock) {
          if (stock === 0)         return 'text-red-600 border-red-200 bg-red-50';
          if (stock <= 5)          return 'text-yellow-700 border-yellow-200 bg-yellow-50';
          return 'text-gray-800';
        },

        mostrarToast(msg, error = false) {
          this.toast = { visible: true, msg, error };
          setTimeout(() => { this.toast.visible = false; }, 3000);
        },
      };
    }
  </script>
</body>
</html>
