<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centro de Control — Panchi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .6; transform: scale(1.4); }
    }
    .pulse { animation: pulse-dot 1.8s ease-in-out infinite; }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fade-in .35s ease-out; }

    /* Scrollbar slim */
    .slim-scroll::-webkit-scrollbar { width: 4px; }
    .slim-scroll::-webkit-scrollbar-track { background: transparent; }
    .slim-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen"
      x-data="monitor()"
      x-init="init()">

  <!-- ═══════════════════════════════════════════════════════════════
       HEADER
  ═══════════════════════════════════════════════════════════════════ -->
  <header class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <span class="text-orange-400 text-xl font-black tracking-tight">PANCHI</span>
      <span class="text-gray-600">|</span>
      <span class="text-gray-300 font-semibold text-sm uppercase tracking-widest">Centro de Control</span>
    </div>
    <div class="flex items-center gap-4">
      <!-- Live indicator -->
      <div class="flex items-center gap-1.5" x-show="!error">
        <span class="w-2 h-2 rounded-full bg-green-400 pulse"></span>
        <span class="text-xs text-gray-500">EN VIVO</span>
      </div>
      <!-- Badge de alertas -->
      <template x-if="alertas.length > 0">
        <span class="bg-orange-500 text-white text-xs font-bold rounded-full px-1.5 py-0.5 leading-none min-w-[1.25rem] text-center"
              x-text="alertas.length"></span>
      </template>
      <div class="flex items-center gap-1.5" x-show="error" x-cloak>
        <span class="w-2 h-2 rounded-full bg-red-500"></span>
        <span class="text-xs text-red-400">SIN CONEXIÓN</span>
      </div>
      <!-- Last updated -->
      <span class="text-xs text-gray-600" x-show="ultimaActualizacion" x-cloak>
        Actualizado <span x-text="tiempoDesde(ultimaActualizacion)"></span>
      </span>
      <!-- Refresh btn -->
      <button @click="cargar()"
              class="text-gray-500 hover:text-white transition text-lg leading-none"
              :class="cargando ? 'animate-spin' : ''">↻</button>
      <!-- Back to dashboard -->
      <a href="/dashboard"
         class="text-xs text-gray-500 hover:text-orange-400 transition border border-gray-700 rounded px-2 py-1">
        ← Dashboard
      </a>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════════════
       KPI TOP BAR
  ═══════════════════════════════════════════════════════════════════ -->
  <div class="bg-gray-900 border-b border-gray-800 px-6 py-3">
    <div class="grid grid-cols-8 gap-3">
      <div class="flex flex-col items-center justify-center py-1.5 px-2 rounded-lg bg-gray-800/50 border border-gray-700/50" :class="{'opacity-40': cargando && !metricas.pedidos_hoy}">
        <div class="text-xs text-gray-500 font-medium mb-0.5 whitespace-nowrap">Pedidos hoy</div>
        <div class="text-xl font-black leading-tight text-white" x-text="metricas.pedidos_hoy ?? '—'"></div>
      </div>
      <div class="flex flex-col items-center justify-center py-1.5 px-2 rounded-lg bg-gray-800/50 border border-gray-700/50">
        <div class="text-xs text-gray-500 font-medium mb-0.5 whitespace-nowrap">Activos</div>
        <div class="text-xl font-black leading-tight text-orange-400" x-text="metricas.pedidos_activos ?? '—'"></div>
      </div>
      <div class="flex flex-col items-center justify-center py-1.5 px-2 rounded-lg bg-gray-800/50 border border-gray-700/50">
        <div class="text-xs text-gray-500 font-medium mb-0.5 whitespace-nowrap">En preparación</div>
        <div class="text-xl font-black leading-tight text-blue-400" x-text="metricas.en_preparacion ?? '—'"></div>
      </div>
      <div class="flex flex-col items-center justify-center py-1.5 px-2 rounded-lg bg-gray-800/50 border border-gray-700/50">
        <div class="text-xs text-gray-500 font-medium mb-0.5 whitespace-nowrap">En reparto</div>
        <div class="text-xl font-black leading-tight text-yellow-400" x-text="metricas.en_reparto ?? '—'"></div>
      </div>
      <div class="flex flex-col items-center justify-center py-1.5 px-2 rounded-lg bg-gray-800/50 border border-gray-700/50">
        <div class="text-xs text-gray-500 font-medium mb-0.5 whitespace-nowrap">Entregados</div>
        <div class="text-xl font-black leading-tight text-green-400" x-text="metricas.entregados_hoy ?? '—'"></div>
      </div>
      <div class="flex flex-col items-center justify-center py-1.5 px-2 rounded-lg bg-gray-800/50 border border-gray-700/50">
        <div class="text-xs text-gray-500 font-medium mb-0.5 whitespace-nowrap">Ingresos hoy</div>
        <div class="text-xl font-black leading-tight text-emerald-400"
             x-text="metricas.ingresos_hoy_eur != null ? metricas.ingresos_hoy_eur.toFixed(2) + '€' : '—'"></div>
      </div>
      <div class="flex flex-col items-center justify-center py-1.5 px-2 rounded-lg bg-gray-800/50 border border-gray-700/50">
        <div class="text-xs text-gray-500 font-medium mb-0.5 whitespace-nowrap">T.Preparación</div>
        <div class="text-xl font-black leading-tight" :class="metricas.tiempo_medio_preparacion_min > 30 ? 'text-red-400' : 'text-gray-200'"
             x-text="metricas.tiempo_medio_preparacion_min != null ? metricas.tiempo_medio_preparacion_min + 'min' : '—'"></div>
      </div>
      <div class="flex flex-col items-center justify-center py-1.5 px-2 rounded-lg bg-gray-800/50 border border-gray-700/50">
        <div class="text-xs text-gray-500 font-medium mb-0.5 whitespace-nowrap">T.Entrega</div>
        <div class="text-xl font-black leading-tight" :class="metricas.tiempo_medio_entrega_min > 40 ? 'text-red-400' : 'text-gray-200'"
             x-text="metricas.tiempo_medio_entrega_min != null ? metricas.tiempo_medio_entrega_min + 'min' : '—'"></div>
      </div>
    </div>
  </div>


  <!-- ═══════════════════════════════════════════════════════════════
       ALERTS BANNER — errores y warnings en una sola franja
  ═══════════════════════════════════════════════════════════════════ -->
  <div x-show="alertas.length > 0" x-cloak
       class="border-b border-gray-800 px-6 py-2"
       :class="alertas.some(a => a.nivel === 'error') ? 'bg-red-950/40' : 'bg-yellow-950/30'">
    <div class="flex items-center gap-3 overflow-x-auto slim-scroll">
      <!-- Errores -->
      <template x-for="a in alertas.filter(a => a.nivel === 'error').slice(0, 4)" :key="'e' + a.pedido_id + a.tipo">
        <span class="text-xs text-red-300 bg-red-900/50 rounded px-2 py-0.5 shrink-0 whitespace-nowrap flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-red-400 shrink-0"></span>
          <span x-text="a.mensaje"></span>
        </span>
      </template>
      <!-- Divisor si hay ambos -->
      <template x-if="alertas.some(a => a.nivel === 'error') && alertas.some(a => a.nivel === 'warning')">
        <span class="h-4 w-px bg-gray-700 shrink-0"></span>
      </template>
      <!-- Warnings -->
      <template x-for="a in alertas.filter(a => a.nivel === 'warning').slice(0, 3)" :key="'w' + a.pedido_id + a.tipo">
        <span class="text-xs text-yellow-300 bg-yellow-900/40 rounded px-2 py-0.5 shrink-0 whitespace-nowrap flex items-center gap-1">
          <span class="text-yellow-500">⚠</span>
          <span x-text="a.mensaje"></span>
        </span>
      </template>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════
       PIPELINE KANBAN
  ═══════════════════════════════════════════════════════════════════ -->
  <div class="bg-gray-900 border-b border-gray-800 px-4 py-2" style="height:196px; overflow:hidden;">
    <div class="grid gap-2 h-full" style="grid-template-columns: 1fr 1.2fr 1fr 1.2fr 0.7fr;">

      <!-- ── COL: PAGADO / CR ───────────────────────────────────── -->
      <div class="flex flex-col min-h-0 rounded-lg overflow-hidden"
           :class="esEmbudoPipeline(['pagado','contra-reembolso']) ? 'ring-1 ring-red-700 bg-red-950/30 animate-pulse' : 'bg-gray-800/40'">
        <div class="px-2 py-1 flex items-center justify-between shrink-0">
          <span class="text-xs font-bold text-emerald-400 uppercase tracking-wide">Pagado/CR</span>
          <span class="text-xs font-mono text-gray-500"
                x-text="pedidosPipeline.filter(p => ['pagado','contra-reembolso'].includes(p.estado)).length"></span>
        </div>
        <div class="flex-1 overflow-hidden px-1.5 pb-1.5 space-y-1">
          <template x-for="p in tarjetasPipeline(['pagado','contra-reembolso'])" :key="p.pedido_id">
            <div class="rounded bg-gray-800/70 border border-gray-700/50 px-2 flex items-center justify-between gap-1 cursor-default group relative"
                 :class="(tarjetasPipeline(['pagado','contra-reembolso']).length + overflowPipeline(['pagado','contra-reembolso'])) <= 3 ? 'py-1.5' : 'py-0.5'">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="text-xs font-bold text-white shrink-0">#<span x-text="p.pedido_id"></span></span>
                <span class="text-xs shrink-0" x-text="pagoIconPipeline(p.forma_pago)"></span>
                <span class="text-xs text-gray-600 shrink-0"><span x-text="p.n_items"></span>u</span>
              </div>
              <span class="text-xs font-semibold shrink-0"
                    :class="timerClassPipeline(p.estado, p.minutos_en_estado)"
                    x-text="p.minutos_en_estado != null ? p.minutos_en_estado + 'm' : '—'"></span>
              <!-- Tooltip portátil -->
              <div class="absolute bottom-full left-0 mb-1 z-20 hidden group-hover:block bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-xs shadow-xl whitespace-nowrap">
                <div class="font-semibold text-white" x-text="p.cliente_nombre"></div>
                <div class="text-gray-400 mt-0.5" x-text="p.direccion_entrega"></div>
                <div class="text-gray-500 mt-0.5"><span x-text="p.total ? p.total.toFixed(2) + '€' : ''"></span></div>
              </div>
            </div>
          </template>
          <template x-if="overflowPipeline(['pagado','contra-reembolso']) > 0">
            <div class="rounded bg-red-900/50 border border-red-700/50 px-2 py-0.5 text-center">
              <span class="text-xs font-bold text-red-300">+<span x-text="overflowPipeline(['pagado','contra-reembolso'])"></span> más</span>
            </div>
          </template>
        </div>
      </div>

      <!-- ── COL: EN PREPARACIÓN ───────────────────────────────── -->
      <div class="flex flex-col min-h-0 rounded-lg overflow-hidden"
           :class="esEmbudoPipeline(['en-preparacion']) ? 'ring-1 ring-red-700 bg-red-950/30 animate-pulse' : 'bg-gray-800/40'">
        <div class="px-2 py-1 flex items-center justify-between shrink-0">
          <span class="text-xs font-bold text-blue-400 uppercase tracking-wide">En prep.</span>
          <span class="text-xs font-mono text-gray-500"
                x-text="pedidosPipeline.filter(p => p.estado === 'en-preparacion').length"></span>
        </div>
        <div class="flex-1 overflow-hidden px-1.5 pb-1.5 space-y-1">
          <template x-for="p in tarjetasPipeline(['en-preparacion'])" :key="p.pedido_id">
            <div class="rounded bg-gray-800/70 border border-gray-700/50 px-2 flex items-center justify-between gap-1 cursor-default group relative"
                 :class="(tarjetasPipeline(['en-preparacion']).length + overflowPipeline(['en-preparacion'])) <= 3 ? 'py-1.5' : 'py-0.5'">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="text-xs font-bold text-white shrink-0">#<span x-text="p.pedido_id"></span></span>
                <span class="text-xs shrink-0" x-text="pagoIconPipeline(p.forma_pago)"></span>
                <span class="text-xs text-gray-600 shrink-0"><span x-text="p.n_items"></span>u</span>
              </div>
              <span class="text-xs font-semibold shrink-0"
                    :class="timerClassPipeline(p.estado, p.minutos_en_estado)"
                    x-text="p.minutos_en_estado != null ? p.minutos_en_estado + 'm' : '—'"></span>
              <div class="absolute bottom-full left-0 mb-1 z-20 hidden group-hover:block bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-xs shadow-xl whitespace-nowrap">
                <div class="font-semibold text-white" x-text="p.cliente_nombre"></div>
                <div class="text-gray-400 mt-0.5" x-text="p.direccion_entrega"></div>
                <div class="text-gray-500 mt-0.5"><span x-text="p.total ? p.total.toFixed(2) + '€' : ''"></span></div>
              </div>
            </div>
          </template>
          <template x-if="overflowPipeline(['en-preparacion']) > 0">
            <div class="rounded bg-red-900/50 border border-red-700/50 px-2 py-0.5 text-center">
              <span class="text-xs font-bold text-red-300">+<span x-text="overflowPipeline(['en-preparacion'])"></span> más</span>
            </div>
          </template>
        </div>
      </div>

      <!-- ── COL: PREPARADO ────────────────────────────────────── -->
      <div class="flex flex-col min-h-0 rounded-lg overflow-hidden"
           :class="esEmbudoPipeline(['preparado']) ? 'ring-1 ring-red-700 bg-red-950/30 animate-pulse' : 'bg-gray-800/40'">
        <div class="px-2 py-1 flex items-center justify-between shrink-0">
          <span class="text-xs font-bold text-indigo-400 uppercase tracking-wide">Preparado</span>
          <span class="text-xs font-mono text-gray-500"
                x-text="pedidosPipeline.filter(p => p.estado === 'preparado').length"></span>
        </div>
        <div class="flex-1 overflow-hidden px-1.5 pb-1.5 space-y-1">
          <template x-for="p in tarjetasPipeline(['preparado'])" :key="p.pedido_id">
            <div class="rounded bg-gray-800/70 border border-gray-700/50 px-2 flex items-center justify-between gap-1 cursor-default group relative"
                 :class="(tarjetasPipeline(['preparado']).length + overflowPipeline(['preparado'])) <= 3 ? 'py-1.5' : 'py-0.5'">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="text-xs font-bold text-white shrink-0">#<span x-text="p.pedido_id"></span></span>
                <span class="text-xs shrink-0" x-text="pagoIconPipeline(p.forma_pago)"></span>
                <span class="text-xs text-gray-600 shrink-0"><span x-text="p.n_items"></span>u</span>
              </div>
              <span class="text-xs font-semibold shrink-0"
                    :class="timerClassPipeline(p.estado, p.minutos_en_estado)"
                    x-text="p.minutos_en_estado != null ? p.minutos_en_estado + 'm' : '—'"></span>
              <div class="absolute bottom-full left-0 mb-1 z-20 hidden group-hover:block bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-xs shadow-xl whitespace-nowrap">
                <div class="font-semibold text-white" x-text="p.cliente_nombre"></div>
                <div class="text-gray-400 mt-0.5" x-text="p.direccion_entrega"></div>
                <div class="text-gray-500 mt-0.5"><span x-text="p.total ? p.total.toFixed(2) + '€' : ''"></span></div>
              </div>
            </div>
          </template>
          <template x-if="overflowPipeline(['preparado']) > 0">
            <div class="rounded bg-red-900/50 border border-red-700/50 px-2 py-0.5 text-center">
              <span class="text-xs font-bold text-red-300">+<span x-text="overflowPipeline(['preparado'])"></span> más</span>
            </div>
          </template>
        </div>
      </div>

      <!-- ── COL: EN REPARTO ───────────────────────────────────── -->
      <div class="flex flex-col min-h-0 rounded-lg overflow-hidden"
           :class="esEmbudoPipeline(['en-reparto']) ? 'ring-1 ring-red-700 bg-red-950/30 animate-pulse' : 'bg-gray-800/40'">
        <div class="px-2 py-1 flex items-center justify-between shrink-0">
          <span class="text-xs font-bold text-orange-400 uppercase tracking-wide">En reparto</span>
          <span class="text-xs font-mono text-gray-500"
                x-text="pedidosPipeline.filter(p => p.estado === 'en-reparto').length"></span>
        </div>
        <div class="flex-1 overflow-hidden px-1.5 pb-1.5 space-y-1">
          <template x-for="p in tarjetasPipeline(['en-reparto'])" :key="p.pedido_id">
            <div class="rounded bg-gray-800/70 border border-gray-700/50 px-2 flex items-center justify-between gap-1 cursor-default group relative"
                 :class="(tarjetasPipeline(['en-reparto']).length + overflowPipeline(['en-reparto'])) <= 3 ? 'py-1.5' : 'py-0.5'">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="text-xs font-bold text-white shrink-0">#<span x-text="p.pedido_id"></span></span>
                <span class="text-xs shrink-0" x-text="pagoIconPipeline(p.forma_pago)"></span>
                <span class="text-xs text-gray-600 shrink-0"><span x-text="p.n_items"></span>u</span>
              </div>
              <span class="text-xs font-semibold shrink-0"
                    :class="timerClassPipeline(p.estado, p.minutos_en_estado)"
                    x-text="p.minutos_en_estado != null ? p.minutos_en_estado + 'm' : '—'"></span>
              <div class="absolute bottom-full left-0 mb-1 z-20 hidden group-hover:block bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-xs shadow-xl whitespace-nowrap">
                <div class="font-semibold text-white" x-text="p.cliente_nombre"></div>
                <div class="text-gray-400 mt-0.5" x-text="p.direccion_entrega"></div>
                <div class="text-gray-500 mt-0.5"><span x-text="p.total ? p.total.toFixed(2) + '€' : ''"></span></div>
              </div>
            </div>
          </template>
          <template x-if="overflowPipeline(['en-reparto']) > 0">
            <div class="rounded bg-red-900/50 border border-red-700/50 px-2 py-0.5 text-center">
              <span class="text-xs font-bold text-red-300">+<span x-text="overflowPipeline(['en-reparto'])"></span> más</span>
            </div>
          </template>
        </div>
      </div>

      <!-- ── COL: ENTREGADOS (stats only) ─────────────────────── -->
      <div class="flex flex-col items-center justify-center rounded-lg bg-gray-800/40 px-2 py-2 text-center">
        <div class="text-xs font-bold text-green-400 uppercase tracking-wide mb-1">Entregados</div>
        <div class="text-3xl font-black text-white leading-none" x-text="metricas.entregados_hoy ?? '—'"></div>
        <div class="text-xs text-gray-500 mt-1">hoy</div>
        <div class="text-sm font-semibold text-emerald-400 mt-2"
             x-text="metricas.ingresos_hoy_eur != null ? metricas.ingresos_hoy_eur.toFixed(0) + '€' : ''"></div>
      </div>

    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════
       MAIN GRID
  ═══════════════════════════════════════════════════════════════════ -->
  <div class="grid grid-cols-[1fr_1fr_340px] gap-4 p-4 h-[calc(100vh-390px)] overflow-hidden">

    <!-- ─── COL 1: PICKERS ─────────────────────────────────────── -->
    <div class="flex flex-col gap-3 overflow-y-auto slim-scroll pr-1">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest">
          📦 Pickers
          <span class="ml-1 text-gray-700"
                x-text="pickers.filter(p => p.estado === 'activo' || p.estado === 'sobrecargado').length + ' activos'"></span>
        </h2>
        <span class="text-xs text-gray-700"
              x-text="pickers.length + ' total'"></span>
      </div>

      <!-- Pedidos sin picker asignado -->
      <template x-if="pedidosSinPicker.length > 0">
        <div class="rounded-xl border border-yellow-700/60 bg-yellow-950/30 p-3">
          <div class="flex items-center gap-2 mb-2">
            <span class="w-2 h-2 rounded-full bg-yellow-400 pulse shrink-0"></span>
            <span class="text-xs font-bold text-yellow-400 uppercase tracking-wide">
              Sin asignar — <span x-text="pedidosSinPicker.length"></span>
              <span x-text="pedidosSinPicker.length === 1 ? ' pedido' : ' pedidos'"></span>
            </span>
          </div>
          <div class="space-y-1.5">
            <template x-for="p in pedidosSinPicker" :key="p.pedido_id">
              <div class="flex items-center justify-between text-xs bg-gray-800/50 rounded-lg px-2.5 py-2">
                <div class="flex items-center gap-2">
                  <span class="font-bold text-white">#<span x-text="p.pedido_id"></span></span>
                  <span class="text-gray-400" x-text="p.cliente_nombre"></span>
                  <span class="text-gray-600"><span x-text="p.n_items"></span> items</span>
                </div>
                <div class="flex items-center gap-2 text-right">
                  <span class="font-semibold text-white" x-text="p.total.toFixed(2) + '€'"></span>
                  <span :class="p.minutos_espera > 10 ? 'text-red-400 font-bold' : 'text-gray-500'"
                        x-text="p.minutos_espera != null ? p.minutos_espera + 'min' : ''"></span>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <template x-if="pickers.length === 0">
        <div class="text-center text-gray-700 text-sm py-10">Sin pickers registrados</div>
      </template>

      <template x-for="emp in pickers" :key="emp.empleado_id">
        <div class="rounded-xl border fade-in transition-all"
             :class="[employeeCardClass(emp.estado), isColapsada('p', emp.empleado_id) ? 'px-4 py-2.5' : 'p-4']">

          <!-- Row 1: Name + status + collapse toggle -->
          <div class="flex items-center justify-between"
               :class="isColapsada('p', emp.empleado_id) ? '' : 'mb-3'"
               @click="toggleCard('p', emp.empleado_id)"
               style="cursor:pointer">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full shrink-0"
                    :class="statusDotClass(emp.estado)"

                    x-text="estadoLabel(emp.estado)"></span>
              <span class="text-gray-600 text-sm transition-transform duration-200 ml-1"

          <div x-show="!isColapsada('r', emp.empleado_id)">

          <template x-if="emp.entregas_activas && emp.entregas_activas.length > 0">

                        </span>
                      </div>
                      <div class="text-xs text-gray-500 truncate" x-text="ea.direccion"></div>
                    </div>
                    <div class="text-right shrink-0">
                      <div class="text-sm font-bold text-white" x-text="ea.total.toFixed(2) + '€'"></div>
                      <div class="text-xs"

                    </div>
                  </div>

                <span>⏸ Libre hace <span x-text="emp.tiempo_inactivo_min"></span> min</span>
              </template>
              <template x-if="emp.tiempo_inactivo_min <= 15">
                <span class="text-gray-600">Libre — última entrega hace <span x-text="emp.tiempo_inactivo_min"></span> min</span>
              </template>

          </template>

          <!-- Stats row -->
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-gray-800/60 rounded-lg py-1.5 px-1">
              <div class="text-base font-bold text-white" x-text="emp.entregados_hoy"></div>
              <div class="text-xs text-gray-600">Hoy</div>
            </div>
            <div class="bg-gray-800/60 rounded-lg py-1.5 px-1">
              <div class="text-base font-bold"
                   :class="emp.tiempo_medio_min == null ? 'text-gray-600' : emp.tiempo_medio_min > 40 ? 'text-red-400' : 'text-gray-200'"
                   x-text="emp.tiempo_medio_min != null ? emp.tiempo_medio_min + 'm' : '—'"></div>
              <div class="text-xs text-gray-600">Avg</div>
            </div>
            <div class="bg-gray-800/60 rounded-lg py-1.5 px-1">
              <div class="text-base font-bold text-gray-200" x-text="emp.pedidos_activos"></div>
              <div class="text-xs text-gray-600">Activos</div>
            </div>
          </div>

          <!-- Last activity + phone + historial -->
          <div class="flex items-center justify-between mt-2.5">
            <span class="text-xs text-gray-700"
                  x-show="emp.ultima_actividad"
                  x-text="'Última act.: ' + tiempoDesde(emp.ultima_actividad)"></span>
            <div class="flex items-center gap-2">
              <template x-if="emp.historial_hoy && emp.historial_hoy.length > 0">
                <button @click.stop="abrirHistorial(emp, 'repartidor')"
                        class="text-xs text-blue-400 hover:text-blue-300 transition border border-blue-800 hover:border-blue-600 rounded px-2 py-0.5">

                </button>
              </template>
              <template x-if="emp.telefono">

    <div class="flex flex-col gap-3 min-h-0">

      <!-- Alerts (collapsible) -->

        <button @click="alertasExpandidas = !alertasExpandidas"
                class="w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-widest hover:text-gray-300 transition mb-2">
          <span>
            🚨 Alertas
            <span class="ml-1 font-bold"
                  :class="alertas.filter(a=>a.nivel==='error').length > 0 ? 'text-red-500' : 'text-yellow-500'"
                  x-text="alertas.length"></span>
          </span>
          <span :class="alertasExpandidas ? 'rotate-90' : ''" class="transition-transform">›</span>
        </button>
        <div x-show="alertasExpandidas" class="space-y-1.5 max-h-40 overflow-y-auto slim-scroll">
          <template x-for="(a, i) in alertas.slice(0, 10)" :key="i">
            <div class="flex items-start gap-2 rounded-lg px-2.5 py-2 text-xs"
                 :class="a.nivel === 'error' ? 'bg-red-950/60 border border-red-900/50' : a.nivel === 'warning' ? 'bg-yellow-950/50 border border-yellow-900/40' : 'bg-gray-800/40 border border-gray-700/50'">
              <span :class="a.nivel === 'error' ? 'text-red-400' : a.nivel === 'warning' ? 'text-yellow-400' : 'text-gray-500'">
                <template x-if="a.nivel === 'error'">🔴</template>
                <template x-if="a.nivel === 'warning'">🟡</template>
                <template x-if="a.nivel === 'info'">🔵</template>
              </span>
              <span :class="a.nivel === 'error' ? 'text-red-200' : a.nivel === 'warning' ? 'text-yellow-200' : 'text-gray-400'"
                    x-text="a.mensaje"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- Feed -->
      <div class="flex-1 min-h-0 flex flex-col">
        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 shrink-0">
          📡 Actividad reciente
        </h3>
        <div class="flex-1 overflow-y-auto slim-scroll space-y-1">
          <template x-if="eventos.length === 0">
            <div class="text-center text-gray-700 text-xs py-8">Sin actividad reciente</div>
          </template>
          <template x-for="e in eventos" :key="e.id">
            <div class="flex items-start gap-2 py-1.5 px-2 rounded-lg hover:bg-gray-800/40 transition fade-in">
              <span class="text-base shrink-0 mt-0.5" x-text="eventoIcon(e.estado_nuevo)"></span>
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1.5 text-xs">
                  <span class="font-semibold text-gray-300">
                    #<span x-text="e.pedido_id"></span>
                  </span>
                  <span class="text-gray-700">→</span>
                  <span class="font-medium"
                        :class="eventoColorClass(e.estado_nuevo)"
                        x-text="estadoPedidoLabel(e.estado_nuevo)"></span>
                </div>
                <div class="text-xs text-gray-700 mt-0.5" x-text="tiempoDesde(e.timestamp)"></div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

  </div><!-- /main grid -->

  <!-- ═══════════════════════════════════════════════════════════════
       JAVASCRIPT
  ═══════════════════════════════════════════════════════════════════ -->
  <!-- ═══════════════════════════════════════════════════════════════
       HISTORIAL MODAL
  ═══════════════════════════════════════════════════════════════════ -->
  <div x-show="modalHistorial.visible" x-cloak
       class="fixed inset-0 z-50 flex items-center justify-center p-4"
       @click.self="modalHistorial.visible = false">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
    <!-- Panel -->
    <div class="relative bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md shadow-2xl fade-in">
      <!-- Header -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-800">
        <div>
          <div class="font-bold text-white" x-text="modalHistorial.nombre"></div>
          <div class="text-xs text-gray-500 mt-0.5"
               x-text="modalHistorial.tipo === 'picker' ? 'Pickings completados hoy' : 'Entregas completadas hoy'"></div>
        </div>
        <button @click="modalHistorial.visible = false"
                class="text-gray-500 hover:text-white transition text-xl leading-none">×</button>
      </div>
      <!-- Resumen rápido -->
      <div class="grid grid-cols-2 gap-3 px-5 py-3 border-b border-gray-800">
        <div class="bg-gray-800/60 rounded-lg p-3 text-center">
          <div class="text-2xl font-black text-white" x-text="modalHistorial.items.length"></div>
          <div class="text-xs text-gray-500 mt-0.5"
               x-text="modalHistorial.tipo === 'picker' ? 'Pedidos pickeados' : 'Pedidos entregados'"></div>
        </div>
        <div class="bg-gray-800/60 rounded-lg p-3 text-center">
          <div class="text-2xl font-black"
               :class="modalHistorial.avgMin == null ? 'text-gray-600' : modalHistorial.avgMin > (modalHistorial.tipo === 'picker' ? 30 : 40) ? 'text-red-400' : 'text-green-400'"
               x-text="modalHistorial.avgMin != null ? modalHistorial.avgMin + ' min' : '—'"></div>
          <div class="text-xs text-gray-500 mt-0.5">Tiempo medio</div>
        </div>
      </div>
      <!-- Lista de pedidos -->
      <div class="overflow-y-auto slim-scroll max-h-72 px-5 py-3 space-y-2">
        <template x-for="(item, idx) in modalHistorial.items" :key="idx">
          <div class="flex items-center justify-between py-2 border-b border-gray-800/60 last:border-0">
            <div class="flex items-center gap-3">
              <span class="text-xs text-gray-600 w-5 text-right" x-text="(idx + 1) + '.'"></span>
              <div>
                <span class="font-semibold text-white text-sm">
                  #<span x-text="item.pedido_id"></span>
                </span>
                <div class="text-xs text-gray-600 mt-0.5"
                     x-text="item.completado_en || item.entregado_en ? tiempoDesde(item.completado_en || item.entregado_en) : ''">
                </div>
              </div>
            </div>
            <div class="flex items-center gap-3 text-right">
              <!-- Duración -->
              <div>
                <div class="text-sm font-bold"
                     :class="item.duracion_min == null ? 'text-gray-600' :
                       (modalHistorial.tipo === 'picker' ? item.duracion_min > 30 : item.duracion_min > 40)
                         ? 'text-red-400' : item.duracion_min < (modalHistorial.tipo === 'picker' ? 15 : 20)
                           ? 'text-green-400' : 'text-gray-200'"
                     x-text="item.duracion_min != null ? item.duracion_min + ' min' : '—'"></div>
                <div class="text-xs text-gray-600">duración</div>
              </div>
              <!-- Total (solo repartidor) -->
              <template x-if="modalHistorial.tipo === 'repartidor' && item.total != null">
                <div>
                  <div class="text-sm font-bold text-white" x-text="item.total.toFixed(2) + '€'"></div>
                  <div class="text-xs"
                       :class="item.forma_pago === 'online' ? 'text-green-600' : 'text-yellow-600'"
                       x-text="item.forma_pago === 'online' ? 'online' : 'cobrado'"></div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
      <!-- Footer -->
      <div class="px-5 py-3 border-t border-gray-800 text-center">
        <button @click="modalHistorial.visible = false"
                class="text-sm text-gray-500 hover:text-white transition">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    function monitor() {
      const PIPELINE_UMBRALES = {
        'pagado':           { w: 10, e: 15 },
        'contra-reembolso': { w: 10, e: 15 },
        'en-preparacion':   { w: 20, e: 30 },
        'preparado':        { w: 10, e: 15 },
        'en-reparto':       { w: 40, e: 60 },
      };
      return {
        metricas: {},
        pedidosPipeline: [],
        pickers: [],
        repartidores: [],
        alertas: [],
        eventos: [],
        incidenciasAbiertas: 0,
        pedidosSinPicker: [],
        pedidosSinRepartidor: [],
        cargando: false,
        error: false,
        ultimaActualizacion: null,
        alertasExpandidas: true,
        colapsadas: {},
        now: new Date(),
        modalHistorial: { visible: false, nombre: '', tipo: '', items: [], avgMin: null },

        async init() {
          await this.cargar();
          setInterval(() => this.cargar(), 15000);
          setInterval(() => { this.now = new Date(); }, 10000);
        },

        async cargar() {
          if (this.cargando) return;
          this.cargando = true;
          try {
            const r = await fetch('/dashboard/monitor/datos');
            if (!r.ok) throw new Error(r.status);
            const data = await r.json();
            this.metricas           = data.metricas || {};
            this.pedidosPipeline    = data.pedidos_pipeline || [];
            this.pickers            = data.pickers || [];
            this.repartidores       = data.repartidores || [];
            this.alertas            = data.alertas || [];
            this.eventos            = data.eventos || [];
            this.incidenciasAbiertas  = data.incidencias_abiertas || 0;
            this.pedidosSinPicker     = data.pedidos_sin_picker || [];
            this.pedidosSinRepartidor = data.pedidos_sin_repartidor || [];
            this.ultimaActualizacion = new Date();
            this.error = false;
          } catch {
            this.error = true;
          } finally {
            this.cargando = false;
          }
        },

        // ── Helpers ──────────────────────────────────────────────

        // ── Pipeline helpers ─────────────────────────────────────
        pedidosPorEstadoPipeline(estados) {
          return this.pedidosPipeline.filter(p => estados.includes(p.estado));
        },

        tarjetasPipeline(estados) {
          return this.pedidosPorEstadoPipeline(estados).slice(0, 5);
        },

        overflowPipeline(estados) {
          const total = this.pedidosPorEstadoPipeline(estados).length;
          return total > 5 ? total - 5 : 0;
        },

        esEmbudoPipeline(estados) {
          const rojos = this.pedidosPorEstadoPipeline(estados).filter(p =>
            p.minutos_en_estado != null &&
            p.minutos_en_estado >= ((PIPELINE_UMBRALES[p.estado] || {}).e || 999)
          );
          return rojos.length >= 3;
        },

        timerClassPipeline(estado, minutos) {
          if (minutos == null) return 'text-gray-500';
          const u = PIPELINE_UMBRALES[estado];
          if (!u) return 'text-gray-500';
          if (minutos >= u.e) return 'text-red-400 font-bold';
          if (minutos >= u.w) return 'text-yellow-400';
          return 'text-green-400';
        },

        pagoIconPipeline(forma_pago) {
          return forma_pago === 'online' ? '💳' : '💵';
        },

        abrirHistorial(emp, tipo) {
          const items = emp.historial_hoy || [];
          const tiempos = items.map(i => i.duracion_min).filter(t => t != null);
          const avg = tiempos.length ? Math.round(tiempos.reduce((a, b) => a + b, 0) / tiempos.length) : null;
          this.modalHistorial = {
            visible: true,
            nombre: emp.nombre,
            tipo,
            items,
            avgMin: avg,
          };
        },

        tiempoDesde(isoStr) {
          if (!isoStr) return '';
          const diff = Math.floor((this.now - new Date(isoStr)) / 1000);
          if (diff < 60)  return 'hace ' + diff + 's';
          if (diff < 3600) return 'hace ' + Math.floor(diff / 60) + 'min';
          return 'hace ' + Math.floor(diff / 3600) + 'h';
        },

        employeeCardClass(estado) {
          return {
            'activo':       'bg-gray-800/70 border-gray-700',
            'sobrecargado': 'bg-red-950/50 border-red-800',
            'inactivo':     'bg-gray-800/40 border-gray-700/50',
            'sin_carga':    'bg-gray-900/50 border-gray-800 opacity-60',
          }[estado] || 'bg-gray-800 border-gray-700';
        },

        statusDotClass(estado) {
          return {
            'activo':       'bg-green-400',
            'sobrecargado': 'bg-red-500',
            'inactivo':     'bg-yellow-400',
            'sin_carga':    'bg-gray-600',
          }[estado] || 'bg-gray-600';
        },

        statusBadgeClass(estado) {
          return {
            'activo':       'border-green-700/50 bg-green-950/50 text-green-400',
            'sobrecargado': 'border-red-700 bg-red-950/60 text-red-400',
            'inactivo':     'border-yellow-700/50 bg-yellow-950/40 text-yellow-400',
            'sin_carga':    'border-gray-700 bg-gray-800 text-gray-500',
          }[estado] || 'border-gray-700 text-gray-500';
        },

        estadoLabel(estado) {
          return { activo: 'Activo', sobrecargado: 'Sobrecargado', inactivo: 'Libre', sin_carga: 'Sin carga' }[estado] || estado;
        },

        rendimientoClass(r) {
          return { rapido: 'bg-green-900 text-green-300', normal: 'bg-gray-700 text-gray-300', lento: 'bg-red-900 text-red-300' }[r] || '';
        },

        rendimientoLabel(r) {
          return { rapido: '⚡ Rápido', normal: '✓ Normal', lento: '🐢 Lento' }[r] || r;
        },

        cargaClass(c) {
          return { ligera: 'bg-green-900/50 text-green-400', media: 'bg-yellow-900/50 text-yellow-400', alta: 'bg-red-900/50 text-red-400' }[c] || 'text-gray-500';
        },

        cargaLabel(c) {
          return { ligera: 'Carga ligera', media: 'Carga media', alta: 'Carga alta' }[c] || '';
        },

        pickingEstadoLabel(estado) {
          return { pendiente: '⏳ pendiente', en_proceso: '🔄 en proceso', con_incidencias: '⚠ incidencias' }[estado] || estado;
        },

        eventoIcon(estado) {
          const m = {
            'en-preparacion': '📦', 'preparado': '✅', 'en-reparto': '🛵',
            'entregado': '🙌', 'cancelado': '❌', 'pagado': '💳',
            'contra-reembolso': '💵',
          };
          return m[estado] || '•';
        },

        eventoColorClass(estado) {
          const m = {
            'en-preparacion': 'text-blue-400', 'preparado': 'text-indigo-400',
            'en-reparto': 'text-orange-400', 'entregado': 'text-green-400',
            'cancelado': 'text-red-400', 'pagado': 'text-emerald-400',
            'contra-reembolso': 'text-purple-400',
          };
          return m[estado] || 'text-gray-400';
        },

        toggleCard(zona, id) {
          const key = zona + '_' + id;
          this.colapsadas[key] = !this.colapsadas[key];
        },

        isColapsada(zona, id) {
          return !!this.colapsadas[zona + '_' + id];
        },

        estadoPedidoLabel(estado) {
          const m = {
            'Pendiente': 'Pendiente', 'pagado': 'Pagado', 'contra-reembolso': 'Contra reembolso',
            'en-preparacion': 'En preparación', 'preparado': 'Preparado',
            'en-reparto': 'En reparto', 'entregado': 'Entregado', 'cancelado': 'Cancelado',
          };
          return m[estado] || estado;
        },
      };
    }
  </script>
</body>
</html>
