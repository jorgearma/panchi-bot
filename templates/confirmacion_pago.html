<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar pedido — Panchi Bot</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="page-header">
    <span class="header-name">{{ name }}</span>
    <span class="header-sep">·</span>
    <span class="header-address">📍 {{ direccion }}</span>
    <span class="header-badge">Envío gratis</span>
  </header>

  <div class="page-content pb-action-bar">

    <div class="order-card">
      <div class="order-card-header">
        <span class="order-card-title">Tu pedido</span>
        <span class="order-id">#{{ pedidoID }}</span>
      </div>

      <ul id="productos" style="list-style:none; margin:0; padding:0;">
        {% for producto in productos %}
        <li class="order-item"
            data-codigo="{{ producto.codigo }}"
            data-unit="{{ (producto.precio / producto.cantidad) | round(2) }}">
          <div class="order-item-left">
            <span class="order-item-name">{{ producto.nombre }}</span>
            <span class="order-item-qty">× {{ producto.cantidad }} ud</span>
          </div>
          <span class="order-item-price">{{ producto.precio }} €</span>
          <button class="remove-btn" onclick="quitarUnidad(this)" title="Quitar una unidad">×</button>
        </li>
        {% endfor %}
      </ul>

      <div class="order-total">
        <span>Total</span>
        <span id="order-total-val">{{ total }} €</span>
      </div>
    </div>

    <div class="info-row">
      ⏱ Tiempo estimado de entrega: <strong>~15 minutos</strong>
    </div>

  </div>

  <div class="action-bar">
    <button class="btn btn-back" onclick="handleBack()">← Volver</button>
    <button class="btn btn-confirm" id="confirmarPedido">Confirmar pago</button>
  </div>

  <script>
    // --- Quitar una unidad ---
    function quitarUnidad(btn) {
      const li      = btn.closest('li');
      const qtyEl   = li.querySelector('.order-item-qty');
      const priceEl = li.querySelector('.order-item-price');
      const unit    = parseFloat(li.dataset.unit);

      let qty = parseInt(qtyEl.textContent.replace(/\D/g, ''), 10);

      if (qty <= 1) {
        li.remove();
      } else {
        qty--;
        qtyEl.textContent   = '× ' + qty + ' ud';
        priceEl.textContent = (unit * qty).toFixed(2) + ' €';
      }

      recalcularTotal();
    }

    function recalcularTotal() {
      let total = 0;
      document.querySelectorAll('#productos li').forEach(li => {
        const txt = li.querySelector('.order-item-price').textContent;
        total += parseFloat(txt.replace('€', '').trim());
      });
      document.getElementById('order-total-val').textContent = total.toFixed(2) + ' €';
    }

    // --- Volver al menú (siempre resetea el estado antes de navegar) ---
    async function handleBack() {
      // Sync sessionStorage with the current DOM state (user may have removed/reduced items)
      const updatedQty = {};
      document.querySelectorAll('#productos li').forEach(li => {
        const nombre = li.querySelector('.order-item-name').textContent.trim();
        const qty    = parseInt(li.querySelector('.order-item-qty').textContent.replace(/\D/g, ''), 10);
        if (qty > 0) updatedQty[nombre] = qty;
      });
      sessionStorage.setItem('cart_{{ token }}', JSON.stringify(updatedQty));

      try {
        await fetch('/api/volver_al_menu', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token: '{{ token }}', userID: '{{ userID }}' })
        });
      } catch (e) {
        console.warn('No se pudo restablecer el estado del pedido:', e);
      }
      window.location.href = '/menu/{{ token }}';
    }

    // --- Confirmar y pagar ---
    document.getElementById('confirmarPedido').addEventListener('click', async () => {
      const items = document.querySelectorAll('#productos li');

      if (items.length === 0) {
        alert('No hay productos en el pedido. Añade algo antes de confirmar.');
        return;
      }

      const productos = Array.from(items).map(li => ({
        codigo:   li.getAttribute('data-codigo'),
        nombre:   li.querySelector('.order-item-name').textContent.trim(),
        cantidad: parseInt(li.querySelector('.order-item-qty').textContent.replace(/\D/g, ''), 10),
        precio:   parseFloat(li.querySelector('.order-item-price').textContent.replace('€', '').trim()),
      }));

      const totalActual = parseFloat(
        document.getElementById('order-total-val').textContent.replace('€', '').trim()
      );

      const order = {
        name:      '{{ name }}',
        direccion: '{{ direccion }}',
        userID:    '{{ userID }}',
        numero:    '{{ numero }}',
        token:     '{{ token }}',
        productos,
        total: totalActual
      };

      try {
        const response = await fetch('{{ public_url }}/api/agregar_pedido', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(order)
        });
        const result = await response.json();
        if (result.redirect_url) {
          sessionStorage.removeItem('cart_{{ token }}');
          window.location.href = result.redirect_url;
        } else {
          alert(result.message || 'Pedido enviado correctamente.');
        }
      } catch (err) {
        console.error('Error de conexión:', err);
        alert('No se pudo conectar con el servidor. Inténtalo de nuevo.');
      }
    });
  </script>
</body>
</html>
