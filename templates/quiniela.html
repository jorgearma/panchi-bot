<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Menú — Panchi Bot</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/product-modal.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    .conf-header {
      background: linear-gradient(145deg, #1DB954 0%, #0F6E3A 100%);
      padding: 18px 0 22px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .conf-header::before {
      content: ''; position: absolute;
      width: 200px; height: 200px; border-radius: 50%;
      background: rgba(255,255,255,0.07);
      top: -60px; right: -50px;
    }
    .conf-header::after {
      content: ''; position: absolute;
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(255,255,255,0.05);
      bottom: -30px; left: 16px;
    }
    .conf-header__row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      position: relative; z-index: 1;
    }
    .conf-header__name {
      font-family: 'Manrope', sans-serif;
      font-weight: 900; font-size: 20px; color: #fff;
      letter-spacing: -0.4px;
    }
    .conf-header__badge {
      background: #FF6B35;
      color: #fff; font-size: 11px; font-weight: 700;
      padding: 5px 13px; border-radius: 20px;
      box-shadow: 0 2px 12px rgba(255,107,53,0.45);
      white-space: nowrap;
      letter-spacing: 0.2px;
    }
    .conf-header__addr {
      display: flex; align-items: center; gap: 10px;
      background: rgba(0,0,0,0.15);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px; padding: 10px 14px;
      margin: 0 16px;
      position: relative; z-index: 1;
      backdrop-filter: blur(10px);
    }
    .conf-header__addr-icon {
      width: 32px; height: 32px; border-radius: 9px;
      background: rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .conf-header__addr-text { display: flex; flex-direction: column; min-width: 0; }
    .conf-header__addr-label {
      font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.55);
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .conf-header__addr-street {
      font-family: 'Manrope', sans-serif;
      font-weight: 800; font-size: 13.5px; color: #fff;
      letter-spacing: -0.2px; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Search bar y categorías: se pegan al top correcto sin hueco */
    #search-bar {
      top: 0;
    }
    #category-nav {
      top: var(--search-height);
    }

    /* Cart bar: safe area */
    #cart-bar {
      bottom: 0;
      left: 0;
      right: 0;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>

  <header class="conf-header">
    <div class="conf-header__row1">
      <span class="conf-header__name">Hola, {{ usuario.nombre.split()[0] }} 👋</span>
      <span class="conf-header__badge">✓ Envío gratis</span>
    </div>
    <div class="conf-header__addr">
      <div class="conf-header__addr-icon">📍</div>
      <div class="conf-header__addr-text">
        <span class="conf-header__addr-label">Dirección de entrega</span>
        <span class="conf-header__addr-street">{{ calle }}</span>
      </div>
    </div>
  </header>

  <!-- Search bar -->
  <div id="search-bar">
    <div class="search-input-wrap">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input"
             placeholder="Buscar producto…"
             autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="search-clear" id="search-clear" type="button" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <div id="category-nav"></div>

  <div id="menu"></div>

  <!-- No-results state -->
  <div id="search-empty">
    <div class="search-empty-icon">🔍</div>
    <p>Sin resultados para <strong id="search-query-text"></strong></p>
  </div>

  <!-- Cart bar (fixed bottom) -->
  <div id="cart-bar">
    <button class="cart-bar-left" type="button" onclick="openCartSheet()">
      <svg class="cart-bar-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <div class="cart-bar-info">
        <span class="cart-count" id="cart-count">0 productos</span>
        <span class="cart-total" id="cart-total">0,00 €</span>
      </div>
      <span class="cart-view-pill">
        ver
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </span>
    </button>
    <button class="cart-bar-btn" type="button" id="submitOrder">Continuar →</button>
  </div>

  <!-- Cart sheet overlay -->
  <div class="cart-sheet-overlay" id="cart-sheet-overlay" onclick="closeCartSheet()"></div>

  <!-- Cart sheet panel -->
  <div class="cart-sheet" id="cart-sheet">
    <div class="cart-sheet-handle"></div>
    <div class="cart-sheet-header">
      <span class="cart-sheet-title">🛍 Tu carrito</span>
      <button class="cart-sheet-close" type="button" onclick="closeCartSheet()">✕</button>
    </div>
    <div class="cart-sheet-list" id="cart-sheet-list"></div>
    <div class="cart-sheet-footer">
      <div class="cart-sheet-total">
        <span>Total</span>
        <span class="cart-sheet-total-amount" id="cart-sheet-total-val">0,00 €</span>
      </div>
      <button class="cart-sheet-confirm" type="button"
              onclick="closeCartSheet(); submitPedido()">
        Confirmar pedido →
      </button>
    </div>
  </div>

  <script>
    // Module-level state — var para que product-modal.js acceda via window
    var menuData   = {};
    var cartItems  = [];   // [{ lineId, itemName, category, qty, removed:[] }]

    const CART_KEY = 'cart_{{ usuario.token }}';

    function _genLineId() {
      return Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    // ── Búsqueda ─────────────────────────────────────────────────────

    function filterMenu(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        document.querySelectorAll('.menu-item').forEach(el => el.style.display = '');
        document.querySelectorAll('.category-section').forEach(el => el.style.display = '');
        document.querySelectorAll('#category-nav button').forEach(el => el.style.display = '');
        document.getElementById('search-empty').classList.remove('visible');
        return;
      }
      let totalMatches = 0;
      document.querySelectorAll('.category-section').forEach(section => {
        const category = section.id.replace('category-', '');
        let sectionMatches = 0;
        section.querySelectorAll('.menu-item').forEach(itemEl => {
          const matches = itemEl.dataset.name.toLowerCase().includes(q);
          itemEl.style.display = matches ? '' : 'none';
          if (matches) sectionMatches++;
        });
        section.style.display = sectionMatches > 0 ? '' : 'none';
        totalMatches += sectionMatches;
        const navBtn = document.querySelector(`#category-nav button[data-category="${category}"]`);
        if (navBtn) navBtn.style.display = sectionMatches > 0 ? '' : 'none';
      });
      const emptyEl = document.getElementById('search-empty');
      if (totalMatches === 0) {
        document.getElementById('search-query-text').textContent = `"${query.trim()}"`;
        emptyEl.classList.add('visible');
      } else {
        emptyEl.classList.remove('visible');
      }
    }

    function clearSearch() {
      const input = document.getElementById('search-input');
      input.value = '';
      document.getElementById('search-clear').classList.remove('visible');
      filterMenu('');
      input.focus();
    }

    // ── Hoja del carrito ─────────────────────────────────────────────

    function _cartTotal() {
      return cartItems.reduce((s, ci) => {
        const cat = Object.keys(menuData).find(c => menuData[c][ci.itemName]);
        if (!cat) return s;
        return s + parseFloat(menuData[cat][ci.itemName].Precio) * ci.qty;
      }, 0);
    }

    function openCartSheet() {
      const activeLines = cartItems.filter(ci => ci.qty > 0);
      if (activeLines.length === 0) return;

      const list = document.getElementById('cart-sheet-list');
      list.innerHTML = '';

      activeLines.forEach(ci => {
        const cat = Object.keys(menuData).find(c => menuData[c][ci.itemName]);
        if (!cat) return;
        const subtotal = parseFloat(menuData[cat][ci.itemName].Precio) * ci.qty;
        const notasHtml = ci.removed && ci.removed.length > 0
          ? `<span class="cart-sheet-item-notes">Sin: ${ci.removed.join(', ')}</span>`
          : '';
        const row = document.createElement('div');
        row.className = 'cart-sheet-item';
        row.dataset.lineId = ci.lineId;
        row.innerHTML = `
          <div class="cart-sheet-item-info">
            <span class="cart-sheet-item-name">${ci.itemName}</span>
            ${notasHtml}
          </div>
          <span class="cart-sheet-item-qty">× ${ci.qty} ud</span>
          <span class="cart-sheet-item-price">${subtotal.toFixed(2).replace('.', ',')} €</span>
          <div class="cart-sheet-item-actions">
            <button class="cart-sheet-item-edit" type="button"
                    onclick="editCartLine('${ci.lineId}')" title="Editar">✏️</button>
            <button class="cart-sheet-item-del" type="button"
                    onclick="deleteCartLine('${ci.lineId}')" title="Eliminar">✕</button>
          </div>
        `;
        list.appendChild(row);
      });

      document.getElementById('cart-sheet-total-val').textContent =
        _cartTotal().toFixed(2).replace('.', ',') + ' €';

      document.getElementById('cart-sheet-overlay').classList.add('open');
      document.getElementById('cart-sheet').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeCartSheet() {
      document.getElementById('cart-sheet-overlay').classList.remove('open');
      document.getElementById('cart-sheet').classList.remove('open');
      document.body.style.overflow = '';
    }

    function deleteCartLine(lineId) {
      const idx = cartItems.findIndex(ci => ci.lineId === lineId);
      if (idx === -1) return;
      const itemName = cartItems[idx].itemName;
      cartItems.splice(idx, 1);
      window.updateCardBadge && window.updateCardBadge(itemName);
      window.updateCartBar  && window.updateCartBar();
      // Actualizar DOM de la hoja sin cerrarla
      const row = document.querySelector(`.cart-sheet-item[data-line-id="${lineId}"]`);
      if (row) row.remove();
      if (cartItems.filter(ci => ci.qty > 0).length === 0) {
        closeCartSheet();
      } else {
        document.getElementById('cart-sheet-total-val').textContent =
          _cartTotal().toFixed(2).replace('.', ',') + ' €';
      }
    }

    function editCartLine(lineId) {
      closeCartSheet();
      if (typeof window.openProductModalEdit === 'function') {
        window.openProductModalEdit(lineId);
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeCartSheet();
    });

    // ── Envío del pedido ─────────────────────────────────────────────

    async function submitPedido() {
      const selectedItems = cartItems
        .filter(ci => ci.qty > 0)
        .map(ci => {
          const cat = Object.keys(menuData).find(c => menuData[c][ci.itemName]);
          if (!cat) return null;
          const { Codigo, Precio, ingredientes } = menuData[cat][ci.itemName];
          return {
            Codigo,
            nombre:                 ci.itemName,
            precio_unitario:        parseFloat(Precio),
            precio_total:           parseFloat(Precio) * ci.qty,
            ingredientes,
            ingredientes_removidos: ci.removed || [],
            cantidad:               ci.qty
          };
        })
        .filter(i => i !== null);

      if (selectedItems.length === 0) {
        alert('Por favor, selecciona al menos un producto.');
        return;
      }

      const order = {
        name:      `{{ usuario.nombre }}`,
        token:     `{{ usuario.token }}`,
        userId:    `{{ usuario.id }}`,
        numero:    `{{ usuario.numero }}`,
        direccion: `{{ usuario.direccion }}`,
        productos: selectedItems
      };

      try {
        const response = await fetch('{{ public_url }}/api/confirmacion', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(order)
        });
        const result = await response.json();
        if (result.redirect_url) {
          window.location.href = result.redirect_url;
        } else {
          alert(result.message || 'Pedido enviado correctamente.');
        }
      } catch (err) {
        console.error('Error de conexión:', err);
        alert('No se pudo conectar con el servidor. Inténtalo de nuevo.');
      }
    }

    // ── Construcción del menú y barra del carrito ────────────────────

    document.addEventListener('DOMContentLoaded', () => {
      const menuDiv     = document.getElementById('menu');
      const navDiv      = document.getElementById('category-nav');
      const cartBar     = document.getElementById('cart-bar');
      const searchInput = document.getElementById('search-input');
      const searchClear = document.getElementById('search-clear');

      searchInput.addEventListener('input', () => {
        const q = searchInput.value;
        searchClear.classList.toggle('visible', q.length > 0);
        filterMenu(q);
      });

      // ── Sección Elegidos ─────────────────────────────────────────────

      // Botón de nav para "Elegidos" (se inserta al principio cuando hay items)
      const elegidosNavBtn = document.createElement('button');
      elegidosNavBtn.type = 'button';
      elegidosNavBtn.textContent = 'Elegidos';
      elegidosNavBtn.dataset.category = '__elegidos__';
      elegidosNavBtn.style.display = 'none';
      elegidosNavBtn.addEventListener('click', () => {
        document.querySelectorAll('#category-nav button').forEach(b => b.classList.remove('active'));
        elegidosNavBtn.classList.add('active');
        document.getElementById('elegidos-section').scrollIntoView({ behavior: 'smooth' });
      });
      navDiv.prepend(elegidosNavBtn);

      // Sección elegidos en el menú (primer hijo de #menu)
      const elegidosSection = document.createElement('div');
      elegidosSection.id = 'elegidos-section';
      elegidosSection.className = 'category-section';
      elegidosSection.style.display = 'none';
      menuDiv.prepend(elegidosSection);

      function _renderElegidos() {
        // Agrupar cartItems por producto
        const grouped = {};
        cartItems.forEach(ci => {
          if (!grouped[ci.itemName]) grouped[ci.itemName] = { qty: 0, category: ci.category };
          grouped[ci.itemName].qty += ci.qty;
        });

        const names = Object.keys(grouped);
        const hasItems = names.length > 0;

        elegidosNavBtn.style.display = hasItems ? '' : 'none';
        elegidosSection.style.display = hasItems ? '' : 'none';

        if (!hasItems) return;

        elegidosSection.innerHTML = '<h2 class="category-title in-view">Elegidos</h2>';

        names.forEach(itemName => {
          const { qty, category } = grouped[itemName];
          const cat = category || Object.keys(menuData).find(c => menuData[c][itemName]);
          if (!cat || !menuData[cat] || !menuData[cat][itemName]) return;
          const producto = menuData[cat][itemName];
          const precio   = parseFloat(producto.Precio);
          const subtotal = precio * qty;

          const itemDiv = document.createElement('div');
          itemDiv.className = 'menu-item menu-item--selected';
          itemDiv.dataset.name     = itemName;
          itemDiv.dataset.item     = itemName;
          itemDiv.dataset.category = cat;
          itemDiv.innerHTML = `
            <div class="menu-item-img-wrap">
              <img src="${producto.Imagen}" alt="${itemName}"
                   onerror="this.closest('.menu-item-img-wrap').classList.add('no-img')">
              <div class="menu-item-img-placeholder">🍽️</div>
              <span class="menu-item-qty-badge visible">${qty}</span>
            </div>
            <div class="menu-details">
              <p class="item-name">${itemName}</p>
              <p class="item-price">${subtotal.toFixed(2).replace('.', ',')} €</p>
              <p class="menu-ingredients">${qty} ud${qty > 1 ? 's' : ''} · ${precio.toFixed(2).replace('.', ',')} € / ud</p>
            </div>
            <button class="menu-item-add-btn" type="button" aria-label="Ver ${itemName}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5"  y1="12" x2="19" y2="12"/>
              </svg>
            </button>
          `;
          elegidosSection.appendChild(itemDiv);
        });
      }

      function buildMenu() {
        Object.keys(menuData).forEach((category, index) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.innerText = category;
          btn.dataset.category = category;
          if (index === 0) btn.classList.add('active');
          btn.addEventListener('click', () => {
            document.querySelectorAll('#category-nav button')
              .forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const section = document.getElementById(`category-${category}`);
            if (section) section.scrollIntoView({ behavior: 'smooth' });
          });
          navDiv.appendChild(btn);

          const section = document.createElement('div');
          section.id = `category-${category}`;
          section.className = 'category-section';
          section.innerHTML = `<h2 class="category-title">${category}</h2>`;

          Object.keys(menuData[category]).forEach(item => {
            const producto     = menuData[category][item];
            const precio       = parseFloat(producto.Precio);
            const ingredientes = producto.ingredientes;
            const imagen       = producto.Imagen;

            const itemDiv = document.createElement('div');
            itemDiv.className = 'menu-item';
            itemDiv.dataset.name     = item;
            itemDiv.dataset.item     = item;
            itemDiv.dataset.category = category;
            itemDiv.innerHTML = `
              <div class="menu-item-img-wrap" id="img-wrap-${item}">
                <img src="${imagen}" alt="${item}"
                     onerror="this.closest('.menu-item-img-wrap').classList.add('no-img')">
                <div class="menu-item-img-placeholder">🍽️</div>
                <span class="menu-item-qty-badge" id="badge-${item}"></span>
              </div>
              <div class="menu-details">
                <p class="item-name">${item}</p>
                <p class="item-price">${precio.toFixed(2)} €</p>
                <p class="menu-ingredients">${ingredientes}</p>
              </div>
              <button class="menu-item-add-btn" type="button" aria-label="Ver ${item}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"/>
                  <line x1="5"  y1="12" x2="19" y2="12"/>
                </svg>
              </button>
            `;
            section.appendChild(itemDiv);
          });

          menuDiv.appendChild(section);
        });
      }

      function _refreshCardHighlight(itemName) {
        const total = cartItems
          .filter(ci => ci.itemName === itemName)
          .reduce((s, ci) => s + ci.qty, 0);
        // Solo la tarjeta del catálogo real (no la de elegidos, que se re-renderiza entera)
        document.querySelectorAll(`.category-section:not(#elegidos-section) .menu-item[data-item="${CSS.escape(itemName)}"]`)
          .forEach(el => el.classList.toggle('menu-item--selected', total > 0));
      }

      function updateCartBar() {
        const total     = _cartTotal();
        const itemCount = cartItems.reduce((s, ci) => s + ci.qty, 0);

        document.getElementById('cart-count').textContent =
          itemCount === 1 ? '1 producto' : `${itemCount} productos`;
        document.getElementById('cart-total').textContent =
          total.toFixed(2).replace('.', ',') + ' €';

        cartBar.classList.toggle('visible', total > 0);
        sessionStorage.setItem(CART_KEY, JSON.stringify(cartItems));
        _renderElegidos();
      }

      // Exponer a product-modal.js
      window.updateCartBar = updateCartBar;

      window.updateCardBadge = function (itemName) {
        const total = cartItems
          .filter(ci => ci.itemName === itemName)
          .reduce((s, ci) => s + ci.qty, 0);
        const badge = document.getElementById('badge-' + itemName);
        if (badge) {
          if (total > 0) {
            badge.textContent = total;
            badge.classList.add('visible');
          } else {
            badge.classList.remove('visible');
          }
        }
        _refreshCardHighlight(itemName);
      };

      function restoreCart() {
        const saved = sessionStorage.getItem(CART_KEY);
        if (!saved) return;
        let savedItems;
        try { savedItems = JSON.parse(saved); } catch { return; }
        if (!Array.isArray(savedItems)) return;

        savedItems.forEach(ci => {
          if (!ci.qty || ci.qty <= 0 || !ci.itemName) return;
          const cat = Object.keys(menuData).find(c => menuData[c][ci.itemName]);
          if (!cat) return;  // producto eliminado del catálogo
          cartItems.push({
            lineId:   ci.lineId || _genLineId(),
            itemName: ci.itemName,
            category: cat,
            qty:      ci.qty,
            removed:  ci.removed || [],
          });
        });

        // Actualizar badges y highlights para todos los productos restaurados
        const uniqueNames = [...new Set(cartItems.map(ci => ci.itemName))];
        uniqueNames.forEach(name => window.updateCardBadge(name));
        updateCartBar();
        _renderElegidos();
      }

      fetch('/api/productos')
        .then(r => r.json())
        .then(data => {
          menuData = data;
          buildMenu();
          restoreCart();

          // Efecto esmeralda al hacer scroll sobre el título de categoría
          const titleObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (!entry.isIntersecting || entry.target._shining) return;
              const title = entry.target;
              title._shining = true;
              title.classList.remove('in-view');
              void title.offsetWidth;
              title.classList.add('in-view');
              setTimeout(() => { title._shining = false; }, 2400);
            });
          }, { threshold: 0.8 });

          document.querySelectorAll('.category-title').forEach(el => {
            titleObserver.observe(el);
          });

          document.addEventListener('click', event => {
            const menuItem = event.target.closest('.menu-item');
            if (!menuItem) return;
            const item     = menuItem.dataset.item;
            const category = menuItem.dataset.category;
            if (item && category && typeof window.openProductModal === 'function') {
              window.openProductModal(item, category);
            }
          });

          document.getElementById('submitOrder').addEventListener('click', submitPedido);
        })
        .catch(err => console.error('Error al obtener el menú:', err));
    });
  </script>
  <script src="/static/js/product-modal.js"></script>
</body>
</html>
