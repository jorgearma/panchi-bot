<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú — Panchi Bot</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="page-header">
    <span class="header-name">{{ usuario.nombre }}</span>
    <span class="header-sep">·</span>
    <span class="header-address">📍 {{ usuario.direccion }}</span>
    <span class="header-badge">Envío gratis</span>
  </header>

  <div id="category-nav"></div>

  <div id="menu"></div>

  <div id="cart-bar">
    <div class="cart-bar-info">
      <span class="cart-count" id="cart-count">0 productos</span>
      <span class="cart-total" id="cart-total">0,00 €</span>
    </div>
    <button class="cart-bar-btn" type="button" id="submitOrder">Continuar →</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let menuData = {};
      const menuDiv    = document.getElementById('menu');
      const navDiv     = document.getElementById('category-nav');
      const cartBar    = document.getElementById('cart-bar');
      const quantities = {};

      function buildMenu() {
        Object.keys(menuData).forEach((category, index) => {
          // Category nav button
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.innerText = category;
          if (index === 0) btn.classList.add('active');
          btn.addEventListener('click', () => {
            document.querySelectorAll('#category-nav button')
              .forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const section = document.getElementById(`category-${category}`);
            if (section) section.scrollIntoView({ behavior: 'smooth' });
          });
          navDiv.appendChild(btn);

          // Category section
          const section = document.createElement('div');
          section.id = `category-${category}`;
          section.className = 'category-section';
          section.innerHTML = `<h2 class="category-title">${category}</h2>`;

          Object.keys(menuData[category]).forEach(item => {
            const producto     = menuData[category][item];
            const precio       = parseFloat(producto.Precio);
            const ingredientes = producto.ingredientes;
            const imagen       = producto.Imagen;
            const productoID   = producto.ProductoID;

            const itemDiv = document.createElement('div');
            itemDiv.className = 'menu-item';
            itemDiv.innerHTML = `
              <img src="${imagen}" alt="${item}" onerror="this.style.display='none'">
              <div class="menu-details">
                <p class="item-name">${item}</p>
                <p class="item-price">${precio.toFixed(2)} €</p>
                <p class="menu-ingredients">${ingredientes}</p>
                <div class="quantity-control">
                  <button class="decrease" data-item="${item}" data-product-id="${productoID}" disabled>−</button>
                  <span class="quantity-display" id="quantity-${item}">0</span>
                  <button class="increase" data-item="${item}" data-product-id="${productoID}">+</button>
                </div>
              </div>
            `;
            section.appendChild(itemDiv);
          });

          menuDiv.appendChild(section);
        });
      }

      function calculateTotal() {
        return Object.entries(quantities)
          .filter(([_, q]) => q > 0)
          .reduce((total, [item, q]) => {
            const cat = Object.keys(menuData).find(c => menuData[c][item]);
            if (!cat) return total;
            return total + parseFloat(menuData[cat][item].Precio) * q;
          }, 0);
      }

      function updateCartBar() {
        const total     = calculateTotal();
        const itemCount = Object.values(quantities).reduce((s, q) => s + q, 0);

        document.getElementById('cart-count').textContent =
          itemCount === 1 ? '1 producto' : `${itemCount} productos`;
        document.getElementById('cart-total').textContent =
          total.toFixed(2).replace('.', ',') + ' €';

        if (total > 0) {
          cartBar.classList.add('visible');
        } else {
          cartBar.classList.remove('visible');
        }
      }

      fetch('/api/productos')
        .then(r => r.json())
        .then(data => {
          menuData = data;
          buildMenu();
          updateCartBar();

          document.addEventListener('click', (event) => {
            const target = event.target;
            if (!target.classList.contains('increase') && !target.classList.contains('decrease')) return;
            event.preventDefault();

            const item = target.dataset.item;
            if (!quantities[item]) quantities[item] = 0;

            if (target.classList.contains('increase')) {
              quantities[item]++;
            } else {
              quantities[item] = Math.max(0, quantities[item] - 1);
            }

            document.getElementById(`quantity-${item}`).innerText = quantities[item];
            document.querySelector(`button.decrease[data-item="${item}"]`).disabled =
              quantities[item] === 0;

            updateCartBar();
          });

          document.getElementById('submitOrder').addEventListener('click', async () => {
            const selectedItems = Object.entries(quantities)
              .filter(([_, q]) => q > 0)
              .map(([item, q]) => {
                const cat = Object.keys(menuData).find(c => menuData[c][item]);
                if (!cat) return null;
                const { Codigo, Precio, ingredientes } = menuData[cat][item];
                return {
                  Codigo,
                  nombre:          item,
                  precio_unitario: parseFloat(Precio),
                  precio_total:    parseFloat(Precio) * q,
                  ingredientes,
                  cantidad:        q
                };
              })
              .filter(i => i !== null);

            if (selectedItems.length === 0) {
              alert('Por favor, selecciona al menos un producto.');
              return;
            }

            const order = {
              name:      `{{ usuario.nombre }}`,
              token:     `{{ usuario.token }}`,
              userId:    `{{ usuario.id }}`,
              numero:    `{{ usuario.numero }}`,
              direccion: `{{ usuario.direccion }}`,
              productos: selectedItems
            };

            try {
              const response = await fetch('{{ public_url }}/api/confirmacion', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify(order)
              });
              const result = await response.json();
              if (result.redirect_url) {
                window.location.href = result.redirect_url;
              } else {
                alert(result.message || 'Pedido enviado correctamente.');
              }
            } catch (err) {
              console.error('Error de conexión:', err);
              alert('No se pudo conectar con el servidor. Inténtalo de nuevo.');
            }
          });
        })
        .catch(err => console.error('Error al obtener el menú:', err));
    });
  </script>
</body>
</html>
