<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú de Pedidos</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="user-info">
    <h2>{{ usuario.nombre }}</h2>
    <div class="user-detail">
      <!-- Icon for address -->
      <svg class="icon-address" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/>
      </svg>
      <span>&nbsp;&nbsp;&nbsp;{{ usuario.direccion }}</span>
    </div>
    <div class="user-detail">
      <!-- Icon for delivery price -->
      <svg class="icon-delivery" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
        <path d="M4 4h16v2H4V4zm0 6h16v2H4v-2zm0 6h16v2H4v-2z"/>
      </svg>
      <span>&nbsp;Precio del delivery: <strong style="color: rgb(248, 246, 246); font-size: 1.1em; font-family: 'Arial Black', sans-serif;">GRATIS</strong></span>

    </div>
    <div class="user-detail">
      <!-- Icon for home -->
      <svg class="icon-home" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
        <path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke="#fafbfc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>&nbsp;&nbsp;&nbsp;<strong style="color: #fafbfc; font-size: 1.2em; font-family: 'Arial Black', sans-serif;">Panchi Bot</strong></span>
    </div>
    
  </div>

  <h1 class="menu-title">
    <span class="menu-label">Productos</span>
    <hr class="title-divider">
  </h1>

  <form id="orderForm">
    <div id="menu"></div>               
    <button type="button" id="submitOrder">Pagar</button>
  </form>
  <div id="notification-popup"></div>
  
  <script>

    

    document.addEventListener('DOMContentLoaded', () => {
      let menuData = {}; // Variable donde se guardarán los datos dinámicos
      const menuDiv = document.getElementById('menu');
      const notificationPopup = document.getElementById('notification-popup');
      const quantities = {};

      // Función que construye el menú dinámicamente usando menuData
    function buildMenu() {
      // Contenedor para los botones de navegación por categoría
      const navContainer = document.createElement('div');
      navContainer.id = 'category-nav';
      // Puedes agregar estilos o ubicar este contenedor donde prefieras
      menuDiv.parentNode.insertBefore(navContainer, menuDiv);

      // Primero, crear un botón por cada categoría
      Object.keys(menuData).forEach(category => {
        const btn = document.createElement('button');
        btn.type = 'button'; // Evita que se envíe el formulario
        btn.innerText = category;
        btn.addEventListener('click', () => {
          const categorySection = document.getElementById(`category-${category}`);
          if (categorySection) {
            categorySection.scrollIntoView({ behavior: 'smooth' });
          }
        });
        navContainer.appendChild(btn);
      });

  // Luego, crea las secciones del menú con un id único para cada categoría
  Object.keys(menuData).forEach(category => {
    const categoryDiv = document.createElement('div');
    categoryDiv.id = `category-${category}`; // id para hacer scroll
    categoryDiv.innerHTML = `<h2 class="category-bubble">${category}</h2>`;
    Object.keys(menuData[category]).forEach(item => {
      const producto = menuData[category][item];
      const precio = parseFloat(producto.Precio);
      const ingredientes = producto.ingredientes;
      const imagen = producto.Imagen;
      const productoID = producto.ProductoID;
      const itemDiv = document.createElement('div');
      itemDiv.className = 'menu-item';
      itemDiv.innerHTML = `
        <div class="menu-details">
          <span class="item-name">
            <strong><span class="item-title">${item}</span> - ${precio.toFixed(2)}€</strong>
          </span>
          <span class="menu-ingredients">Ingredientes: ${ingredientes}</span>
          <div class="quantity-control">
            <button class="decrease" data-item="${item}" data-product-id="${productoID}" disabled>-</button>
            <span class="quantity-display" id="quantity-${item}">0</span>
            <button class="increase" data-item="${item}" data-product-id="${productoID}">+</button>
          </div>
        </div>
        <img src="${imagen}" alt="${item}">
      `;
      categoryDiv.appendChild(itemDiv);
    });
    menuDiv.appendChild(categoryDiv);
  });
}


      // Función para calcular el total del pedido
      const calculateTotal = () => {
        return Object.entries(quantities)
          .filter(([_, quantity]) => quantity > 0)
          .reduce((total, [item, quantity]) => {
            const category = Object.keys(menuData).find(cat => menuData[cat][item]);
            if (!category) return total;
            const { Precio } = menuData[category][item];
            return total + (parseFloat(Precio) * quantity);
          }, 0);
      };

      // Función para mostrar la notificación con el total y los productos agregados (lista oculta)
      const showNotification = () => {
  const total = calculateTotal().toFixed(2);
  const itemsList = Object.entries(quantities)
    .filter(([_, quantity]) => quantity > 0)
    .map(([item, quantity]) => {
      const category = Object.keys(menuData).find(cat => menuData[cat][item]);
      if (!category) return '';
      const { Precio } = menuData[category][item];
      return `<li>${item} - ${quantity} x ${parseFloat(Precio).toFixed(2)}€</li>`;
    }).join('');
  
  notificationPopup.innerHTML = `
    <p>Total <span id="total-amount">${total}€</span></p>
    <ul style="display: none;">${itemsList}</ul>
  `;


  // Activar la vibración del contenedor
  notificationPopup.classList.add('vibrating');
  setTimeout(() => {
    notificationPopup.classList.remove('vibrating');
  }, 300); // Duración de la animación de vibración
};

document.addEventListener('click', (event) => {
  if (notificationPopup.contains(event.target)) {
    // Si se hace clic dentro del popup, alternar la expansión
    notificationPopup.classList.toggle('expanded');
    const itemsList = notificationPopup.querySelector('ul');
    if (notificationPopup.classList.contains('expanded')) {
      itemsList.style.display = 'block'; // Mostrar la lista
    } else {
      itemsList.style.display = 'none'; // Ocultar la lista
    }
  } else {
    // Si se hace clic fuera del popup, cerrarlo
    notificationPopup.classList.remove('expanded');
    notificationPopup.querySelector('ul').style.display = 'none';
  }
});
      // Obtener los datos del menú desde el endpoint
      fetch('/api/productos')
        .then(response => response.json())
        .then(data => {
          menuData = data;
          buildMenu();
          
          // Asignar listener para los botones de aumento y disminución de cantidad
          document.addEventListener('click', (event) => {
            if (event.target.classList.contains('increase') || event.target.classList.contains('decrease')) {
              event.preventDefault();
              const item = event.target.dataset.item;
              if (!quantities[item]) quantities[item] = 0;
              if (event.target.classList.contains('increase')) {
                quantities[item]++;
              } else if (event.target.classList.contains('decrease')) {
                quantities[item] = Math.max(0, quantities[item] - 1);
              }
              document.getElementById(`quantity-${item}`).innerText = quantities[item];
              document.querySelector(`button.decrease[data-item="${item}"]`).disabled = quantities[item] === 0;
              showNotification();
            }
          });

          // Mostrar la notificación inicial
          showNotification();
        })
        .catch(error => console.error('Error al obtener el menú:', error));

  document.getElementById('submitOrder').addEventListener('click', async () => {
  // Filtrar los productos seleccionados
  const selectedItems = Object.entries(quantities)
    .filter(([_, quantity]) => quantity > 0)
    .map(([item, quantity]) => {
      const category = Object.keys(menuData).find(cat => menuData[cat][item]);
      if (!category) return null;
      // Extraer el identificador (codigo) del producto y la cantidad
      const { Codigo, Precio, ingredientes } = menuData[category][item];
      return {
        Codigo, // Identificador único del producto
        nombre: item, // Nombre del producto
         // Cantidad seleccionada
        precio_unitario: parseFloat(Precio), // Precio unitario
        precio_total: parseFloat(Precio) * quantity, // Precio total por cantidad
        ingredientes // Ingredientes del producto
      };
    })
    .filter(item => item !== null);

  if (selectedItems.length === 0) {
    alert('Por favor, selecciona al menos un producto.');
    return;
  }

  // Crear el objeto del pedido
  // Crear el objeto del pedido
const order = {
  name: `{{ usuario.nombre }}`,
  token: `{{ usuario.token }}`,
  userId: `{{ usuario.id }}`,
  numero: `{{ usuario.numero }}`,
  direccion: `{{ usuario.direccion }}`,
  productos: selectedItems.map(item => ({
    ...item,
    cantidad: quantities[item.nombre] // Agregar la cantidad seleccionada
  }))
};

  // Enviar el pedido al servidor
  try {
    const response = await fetch('https://bebb-62-116-223-170.ngrok-free.app/api/confirmacion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(order)
    });
    const result = await response.json();
    if (result.redirect_url) {
      window.location.href = result.redirect_url;
    } else {
      alert(result.message || 'Pedido enviado correctamente.');
    }
  } catch (err) {
    console.error('Error de conexión:', err);
    alert('No se pudo conectar con el servidor. Inténtalo de nuevo.');
  }
});
    });
  </script>
</body>
</html>
