<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Pedidos</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        h1, h2 {
            text-align: center;
            color: #333;
            font-weight: 500;
        }
        #user-info {
            background-color: #007bff;
            color: white;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
        #user-info h2 {
            margin: 0;
            font-size: 1.8em;
            font-weight: bold;
        }
        .user-detail {
            display: flex;
            align-items: center;
            font-size: 1.1em;
            gap: 10px;
        }
        .user-detail i {
            font-size: 1.3em;
            color: #ffffff;
        }
        .user-detail span {
            font-weight: 400;
        }
        .user-detail svg {
            width: 24px;
            height: 24px;
        }
        /* Icon styles */
        .icon-address path {
            fill: white;
        }
        #orderForm {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        #menu {
            margin: 20px 0;
        }

        .menu-ingredients {
        color: #888; /* Color gris tenue */
        font-size: 0.9em; /* Fuente más pequeña */
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #f3f3f3;
            border-radius: 5px;
            

        }
        .item-title {
            font-weight: bold;
            font-size: 1.2em; /* Ajusta según el tamaño deseado */
        }
        .menu-item .menu-details {
            display: flex;
            
            flex-direction: column;
            justify-content: space-between;
            max-width: 70%;
        }
        .menu-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            margin-left: 20px;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        .quantity-control button {
            width: 40px;
            height: 40px;
        font-size: 20px;
        border: none;
        background-color: #007bff;
        color: white;
        border-radius: 50%;
        cursor: pointer;
        transition: background-color 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .quantity-control button.decrease {
        background-color: #ff4d4d;
    }
    .quantity-control button.decrease:disabled {
        background-color: #ccc;
        cursor: not-allowed;
    }
    .quantity-control button:hover:not(:disabled) {
        background-color: #0056b3;
    }
    .quantity-control button.decrease:hover:not(:disabled) {
        background-color: #cc0000;
    }
    .quantity-display {
        width: 50px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        margin: 0 10px;
        color: #007bff;
    }
    label, input, button {
        font-size: 16px;
    }
    button {
        padding: 10px 20px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background-color: #218838;
    }
    #notification-popup {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        font-size: 16px;
        font-weight: bold;
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.5s ease, transform 0.5s ease;
    }
</style>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="user-info">
        <h2>Bienvenido, {{ usuario.nombre }}</h2>
        <div class="user-detail">
            <!-- Icon for address -->
            <svg class="icon-address" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/>
            </svg>
            <span>{{ usuario.direccion }}</span>
        </div>
        <div class="user-detail">
            <!-- Icon for phone -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
                <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.09-.23 11.05 11.05 0 003.47.57 1 1 0 011 1v3.06a1 1 0 01-1 1A19.05 19.05 0 015 5a1 1 0 011-1h3.06a1 1 0 011 1c0 1.21.2 2.38.57 3.47a1 1 0 01-.23 1.09l-2.2 2.2z" fill="white"/>
            </svg>
            <span>{{ usuario.numero_cliente }}</span>
        </div>
    </div>
    <h1>Menú</h1>
    <form id="orderForm">
        <div id="menu"></div>
        <button type="button" id="submitOrder">Enviar</button>
    </form>
    <div id="notification-popup"></div>
    <script>
        const menu = {
            "🍔 *HAMBURGUESAS*": {
                "clasica": {"precio": 5.00, "codigo": 301, "ingredientes": "Carne, Queso, Lechuga, Tomate"},
                "ranchera": {"precio": 5.50, "codigo": 302, "ingredientes": "Carne, Queso, Bacon, Salsa BBQ"},
                "crispy": {"precio": 6.00, "codigo": 303, "ingredientes": "Pollo, Queso, Lechuga, Tomate"}
            },
            "🌭 *PERRITOS*": {
                "clasico": {"precio": 4.00, "codigo": 401, "ingredientes": "Salchicha, Pan, Mostaza, Ketchup"},
                "picanton": {"precio": 4.00, "codigo": 402, "ingredientes": "Salchicha, Pan, Jalapeños, Salsa Picante"},
                "texano": {"precio": 4.00, "codigo": 403, "ingredientes": "Salchicha, Pan, Cebolla Frita, Salsa BBQ"},
        "bbq": {"precio": 4.00, "codigo": 404, "ingredientes": "Salchicha, Pan, Bacon, Salsa BBQ"}
    },
    "🍨 *POSTRES*": {
        "flan": {"precio": 4.00, "codigo": 501, "ingredientes": "Leche, Azúcar, Huevos"},
        "tarta": {"precio": 5.00, "codigo": 502, "ingredientes": "Harina, Azúcar, Huevos, Frutas"},
        "helado": {"precio": 3.50, "codigo": 503, "ingredientes": "Leche, Azúcar, Saborizante"}
    },
    "🥤 *BEBIDAS*": {
        "agua": {"precio": 1.50, "codigo": 601, "ingredientes": "Agua"},
        "vino": {"precio": 4.00, "codigo": 602, "ingredientes": "Uvas"},
        "cerveza": {"precio": 3.00, "codigo": 603, "ingredientes": "Cebada, Lúpulo, Agua"},
        "refresco": {"precio": 2.50, "codigo": 604, "ingredientes": "Agua, Azúcar, Saborizante"},
        "café": {"precio": 2.00, "codigo": 605, "ingredientes": "Café"}
    }
};
const menuDiv = document.getElementById('menu');
const notificationPopup = document.getElementById('notification-popup');
const quantities = {};
// Función para calcular el total
const calculateTotal = () => {
    return Object.entries(quantities)
        .filter(([_, quantity]) => quantity > 0)
        .reduce((total, [item, quantity]) => {
            const category = Object.keys(menu).find(cat => menu[cat][item]);
            const { precio } = menu[category][item];
            return total + (precio * quantity);
        }, 0);
};
// Función para mostrar el popup
const showNotification = (message) => {
    notificationPopup.innerText = message;
};
// Crear elementos dinámicos del menú
Object.keys(menu).forEach(category => {
    const categoryDiv = document.createElement('div');
    categoryDiv.innerHTML = `<h2>${category}</h2>`;
    Object.keys(menu[category]).forEach(item => {
        const { precio, ingredientes } = menu[category][item];
        const itemDiv = document.createElement('div');
        itemDiv.className = 'menu-item';
        itemDiv.innerHTML = `
            <div class="menu-details">
                <span class="item-name">
                <strong><span class="item-title">${item}</span> - ${precio.toFixed(2)}€</strong>
                </span>
                <span class="menu-ingredients">Ingredientes: ${ingredientes}</span>
                <div class="quantity-control">
                    <button class="decrease" data-item="${item}" disabled>-</button>
                    <span class="quantity-display" id="quantity-${item}">0</span>
                    <button class="increase" data-item="${item}">+</button>
                </div>
            </div>
            <img src="{{ url_for('static', filename='imagenes/clasica.jpeg') }}" alt="Hamburguesa Clásica">
        `;
        categoryDiv.appendChild(itemDiv);
    });
    menuDiv.appendChild(categoryDiv);
});

        // Controlar la cantidad de productos
        document.addEventListener('click', (event) => {
            if (event.target.classList.contains('increase') || event.target.classList.contains('decrease')) {
                event.preventDefault();
                const item = event.target.dataset.item;
                if (!quantities[item]) quantities[item] = 0;
                if (event.target.classList.contains('increase')) {
                    quantities[item]++;
                } else if (event.target.classList.contains('decrease')) {
                    quantities[item] = Math.max(0, quantities[item] - 1);
                }
                document.getElementById(`quantity-${item}`).innerText = quantities[item];
                document.querySelector(`button.decrease[data-item="${item}"]`).disabled = quantities[item] === 0;
                showNotification(`Total: $${calculateTotal().toFixed(2)}`);
            }
        });

        // Mostrar el total inicial
        showNotification(`Total: $${calculateTotal().toFixed(2)}`);

        document.getElementById('submitOrder').addEventListener('click', async () => {
        // Capturamos el teléfono del usuario proporcionado por Flask
        const phone = `{{ usuario.numero_cliente }}`;

        // Filtramos y transformamos los productos seleccionados
        const selectedItems = Object.entries(quantities)
            .filter(([_, quantity]) => quantity > 0)
            .map(([item, quantity]) => {
                const category = Object.keys(menu).find(cat => menu[cat][item]);
                const { precio } = menu[category][item];
                return [item, precio]; // Formato requerido: [item, precio]
            });

        // Validación: asegurarnos de que haya al menos un producto seleccionado
        if (selectedItems.length === 0) {
            alert('Por favor, selecciona al menos un producto.');
            return;
        }

        // Crear el objeto del pedido
        const order = {
            [phone]: selectedItems
        };

        // Enviar el pedido al servidor
        try {
            const response = await fetch('http://127.0.0.1:5000/api/agregar_pedido', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(order)
            });

            if (response.ok) {
                const result = await response.json();
                alert(result.message || 'Pedido enviado correctamente.');
            } else {
                const error = await response.json();
                alert('Error al enviar el pedido: ' + (error.message || 'Desconocido'));
            }
        } catch (err) {
            console.error('Error de conexión:', err);
            alert('No se pudo conectar con el servidor. Inténtalo de nuevo.');
        }
    });
    
    </script>
</body>
</html>
