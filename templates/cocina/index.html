<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Panchi — Cocina</title>
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cocina">
  <link rel="manifest" href="/cocina/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    button { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-900 min-h-screen"
      x-data="cocinaApp({{ cocinero_id or 'null' }})"
      x-init="init()">

  <!-- HEADER -->
  <header class="border-b border-gray-800 bg-gray-900 px-4 py-3 sticky top-0 z-10">
    <div class="max-w-lg mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="text-lg">👨‍🍳</span>
        <p class="text-sm font-bold text-white">Cocina</p>
      </div>
      <div class="flex items-center gap-2">
        <span x-show="cola.length > 0" x-cloak
              class="rounded-full bg-amber-500 text-gray-900 text-xs font-bold px-2 py-0.5"
              x-text="cola.length + ' en cola'"></span>
        <button @click="recargar()"
                class="rounded-lg bg-gray-800 px-3 py-1.5 text-xs text-gray-400 active:bg-gray-700 transition">
          ↻ Actualizar
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 py-4 space-y-4">

    <!-- Cola de preparaciones sin asignar -->
    <template x-if="cola.length > 0">
      <div>
        <p class="text-xs text-amber-400 uppercase tracking-wide font-semibold mb-2">
          Pendientes de aceptar
        </p>
        <div class="space-y-2">
          <template x-for="item in cola" :key="item.picking_id">
            <div class="bg-amber-950/50 border border-amber-800 rounded-xl p-4 flex items-center justify-between gap-3">
              <div>
                <p class="text-white font-semibold text-sm">Pedido #<span x-text="item.pedido_id"></span></p>
                <p class="text-amber-300 text-xs mt-0.5"
                   x-text="item.n_items + ' producto' + (item.n_items !== 1 ? 's' : '') + ' · ' + formatSegundos(item.segundos_esperando)"></p>
              </div>
              <button @click="aceptar(item.picking_id)"
                      :disabled="aceptando === item.picking_id"
                      class="bg-amber-500 text-gray-900 text-sm font-bold px-4 py-2 rounded-lg active:opacity-80 transition disabled:opacity-50">
                <span x-text="aceptando === item.picking_id ? '...' : 'Aceptar'"></span>
              </button>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Mis preparaciones activas -->
    <div>
      <p class="text-xs text-gray-500 uppercase tracking-wide font-semibold mb-2">Mis comandas</p>

      <template x-if="cargando">
        <div class="bg-gray-800 rounded-xl p-6 text-center">
          <p class="text-gray-500 text-sm">Cargando...</p>
        </div>
      </template>

      <template x-if="!cargando && misPedidos.length === 0">
        <div class="bg-gray-800 rounded-xl p-6 text-center">
          <p class="text-3xl mb-2">👨‍🍳</p>
          <p class="text-gray-400 text-sm">Sin comandas activas</p>
          <p class="text-gray-600 text-xs mt-1">Las nuevas comandas aparecerán aquí</p>
        </div>
      </template>

      <div class="space-y-3">
        <template x-for="p in misPedidos" :key="p.picking_id">
          <div class="bg-gray-800 rounded-xl overflow-hidden border border-gray-700">

            <!-- Cabecera de la comanda -->
            <div class="px-4 py-3 bg-gray-750 border-b border-gray-700 flex items-center justify-between">
              <div>
                <p class="text-white font-bold text-base">Pedido #<span x-text="p.pedido_id"></span></p>
                <p class="text-gray-400 text-xs mt-0.5" x-text="p.cliente_nombre"></p>
              </div>
              <div class="text-right">
                <p class="text-green-400 font-bold text-sm" x-text="'€' + p.total.toFixed(2)"></p>
                <p class="text-gray-500 text-xs mt-0.5" x-text="p.iniciado_en ? 'Iniciado ' + formatHoraISO(p.iniciado_en) : ''"></p>
              </div>
            </div>

            <!-- Dirección de entrega -->
            <div class="px-4 py-2 bg-gray-800/50">
              <p class="text-xs text-gray-500">📍 <span x-text="p.direccion_entrega"></span></p>
            </div>

            <!-- Líneas del pedido (si las hay) -->
            <template x-if="p.items && p.items.length > 0">
              <div class="divide-y divide-gray-700/50">
                <template x-for="item in p.items" :key="item.item_id || item.detalle_id">
                  <div class="px-4 py-2.5 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                      <span class="text-gray-400 font-mono text-sm font-bold" x-text="'×' + item.cantidad"></span>
                      <span class="text-white text-sm" x-text="item.nombre"></span>
                    </div>
                    <span x-show="item.notas" x-cloak
                          class="text-xs text-orange-400 font-semibold bg-orange-950/40 border border-orange-900/40 px-2 py-0.5 rounded-md"
                          x-text="item.notas"></span>
                  </div>
                </template>
              </div>
            </template>

            <!-- Notas del picker -->
            <template x-if="p.notas">
              <div class="px-4 py-2 bg-yellow-950/30 border-t border-yellow-900/30">
                <p class="text-xs text-yellow-400">📝 <span x-text="p.notas"></span></p>
              </div>
            </template>

            <!-- Acción: marcar listo -->
            <div class="px-4 py-3 border-t border-gray-700">
              <button @click="marcarListo(p.picking_id)"
                      :disabled="finalizando === p.picking_id"
                      class="w-full bg-green-600 text-white font-bold py-3 rounded-lg text-sm active:bg-green-700 transition disabled:opacity-50">
                <span x-text="finalizando === p.picking_id ? 'Marcando listo...' : '✓ Listo para entregar'"></span>
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Enlace al hub -->
    <a href="/empleado"
       class="block text-center text-xs text-gray-600 py-2 active:text-gray-400 transition">
      ← Volver al hub
    </a>

  </main>

  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/cocina/sw.js', { scope: '/cocina' }).catch(() => {});
  }

  function cocinaApp(cocineroId) {
    return {
      cocineroId,
      misPedidos: [],
      cola: [],
      cargando: true,
      aceptando: null,
      finalizando: null,

      async init() {
        await this.recargar();
        setInterval(() => this.recargar(), 20000);
      },

      async recargar() {
        await Promise.all([this.cargarMisPedidos(), this.cargarCola()]);
      },

      async cargarMisPedidos() {
        this.cargando = true;
        try {
          const r = await fetch('/cocina/mis-pedidos');
          if (r.ok) this.misPedidos = await r.json();
        } catch (_) {}
        finally { this.cargando = false; }
      },

      async cargarCola() {
        try {
          const r = await fetch('/cocina/cola');
          if (r.ok) {
            const d = await r.json();
            this.cola = d.cola || [];
          }
        } catch (_) {}
      },

      async aceptar(pickingId) {
        this.aceptando = pickingId;
        try {
          const r = await fetch(`/cocina/cola/coger/${pickingId}`, { method: 'POST' });
          if (r.ok) {
            await this.recargar();
          } else if (r.status === 409) {
            await this.recargar();
          } else {
            const d = await r.json();
            alert(d.error || 'No se pudo aceptar');
          }
        } catch (_) {
          alert('Error de conexión');
        } finally {
          this.aceptando = null;
        }
      },

      async marcarListo(pickingId) {
        if (!confirm('¿Marcar este pedido como listo para entregar?')) return;
        this.finalizando = pickingId;
        try {
          const r = await fetch(`/cocina/preparacion/${pickingId}/finalizar`, { method: 'POST' });
          if (r.ok) {
            await this.cargarMisPedidos();
          } else {
            const d = await r.json();
            alert(d.error || 'Error al finalizar');
          }
        } catch (_) {
          alert('Error de conexión');
        } finally {
          this.finalizando = null;
        }
      },

      formatHoraISO(iso) {
        if (!iso) return '';
        const s = iso.endsWith('Z') || iso.includes('+') ? iso : iso + 'Z';
        return new Date(s).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      },

      formatSegundos(s) {
        if (s < 60) return s + 's';
        const m = Math.floor(s / 60);
        return m + ' min';
      },
    };
  }
  </script>

</body>
</html>
