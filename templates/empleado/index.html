<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Panchi — Mi zona</title>
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mi zona">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    button { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-900 min-h-screen"
      x-data="empleadoHub({{ empleado_id or 'null' }}, '{{ rol or '' }}')"
      x-init="init()">

  <!-- ======== HEADER ======== -->
  <header class="border-b border-gray-800 bg-gray-900 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <p class="min-w-0 truncate text-sm font-bold text-white" x-text="nombreCompleto"></p>
      <span class="rounded-full border border-gray-700 bg-gray-800 px-2.5 py-1 text-[11px] font-semibold uppercase tracking-[0.14em] text-gray-400 flex-shrink-0"
            x-text="rolLabel"></span>
    </div>
  </header>

  <!-- ======== CONTENIDO ======== -->
  <main class="max-w-md mx-auto px-4 py-4 space-y-3">

    <!-- Turno de hoy + fichaje -->
    <div class="bg-blue-950 rounded-xl p-3 border border-blue-900">
      <template x-if="turno">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs text-blue-300 uppercase tracking-wide">Turno hoy</p>
            <p class="text-white font-semibold text-sm mt-0.5"
               x-text="turno.hora_inicio + ' – ' + turno.hora_fin"></p>
            <p x-show="fichajeActivo && fichajeInicio" x-cloak
               class="text-xs text-blue-300 mt-0.5"
               x-text="'En curso desde las ' + formatHoraISO(fichajeInicio)"></p>
            <p x-show="turno.notas" x-cloak class="text-gray-400 text-xs mt-0.5" x-text="turno.notas"></p>
          </div>
          <div class="flex flex-col items-end gap-1">
            <!-- Sin turno abierto: botón iniciar -->
            <div x-show="!fichajeActivo" class="flex flex-col items-center">
              <button @click="iniciarTurno()"
                      :disabled="!puedeIniciarTurno"
                      :class="puedeIniciarTurno
                        ? 'bg-green-600 text-white active:bg-green-700'
                        : 'bg-gray-700 text-gray-500 cursor-not-allowed opacity-60'"
                      class="text-xs px-3 py-1.5 rounded-lg transition font-semibold">
                ▶ Iniciar turno
              </button>
              <span x-show="!puedeIniciarTurno" x-text="razonNoIniciar" class="text-xs text-gray-500 mt-1 text-center block"></span>
            </div>
            <!-- Con turno abierto: cerrar -->
            <button x-show="fichajeActivo"
                    @click="cerrarTurno()"
                    class="bg-gray-700 text-red-400 text-xs px-3 py-1.5 rounded-lg transition active:bg-gray-600">
              ⏹ Cerrar turno
            </button>
          </div>
        </div>
      </template>
      <template x-if="!turno">
        <div class="flex items-center gap-3">
          <span class="text-xl">🗓️</span>
          <div>
            <p class="text-gray-400 text-sm">Sin turno registrado</p>
            <p class="text-gray-600 text-xs mt-0.5">El manager lo añadirá pronto</p>
          </div>
        </div>
      </template>
    </div>

    <!-- Colas globales -->
    <div>
      <p class="text-xs text-gray-500 uppercase tracking-wide mb-2">Colas ahora</p>
      <div class="grid grid-cols-2 gap-2">
        <div class="bg-gray-800 rounded-xl p-3 flex items-center justify-between">
          <div>
            <p class="text-xs text-gray-500">Sin picker</p>
            <p class="text-xl font-bold mt-0.5"
               :class="metricas.sin_picker > 0 ? 'text-amber-400' : 'text-gray-600'"
               x-text="metricas.sin_picker ?? '—'"></p>
          </div>
          <span class="text-2xl">📦</span>
        </div>
        <div class="bg-gray-800 rounded-xl p-3 flex items-center justify-between">
          <div>
            <p class="text-xs text-gray-500">Sin repartidor</p>
            <p class="text-xl font-bold mt-0.5"
               :class="metricas.sin_repartidor > 0 ? 'text-orange-400' : 'text-gray-600'"
               x-text="metricas.sin_repartidor ?? '—'"></p>
          </div>
          <span class="text-2xl">🛵</span>
        </div>
      </div>
    </div>

    <!-- CTA principal — App operativa -->
    <a :href="appUrl"
       :class="appGradient"
       class="block rounded-xl p-4 active:opacity-90 transition">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-xs uppercase tracking-wide" :class="appSubtitleColor">Mi app</p>
          <p class="text-white font-bold text-base mt-1" x-text="appLabel"></p>
          <p class="text-xs mt-1" :class="appSubtitleColor"
             x-text="pedidosAsignados === 0 ? '0 asignados ahora' : pedidosAsignados + ' asignado' + (pedidosAsignados > 1 ? 's' : '')"></p>
        </div>
        <span class="bg-white text-sm font-bold px-3 py-2 rounded-lg" :class="appBtnColor">
          Entrar →
        </span>
      </div>
    </a>

    <!-- Cambiar rol — solo visible si polivalente -->
    <template x-if="capacidades.length > 1">
      <button @click="cambiarRol()"
              class="w-full rounded-xl border px-4 py-3 text-sm font-semibold transition active:opacity-70"
              :class="rol === 'repartidor'
                ? 'border-blue-800 bg-blue-950/50 text-blue-300'
                : 'border-orange-800 bg-orange-950/50 text-orange-300'">
        ⇄ Cambiar a <span x-text="rolOpuesto"></span>
      </button>
    </template>

    <!-- Stats del día -->
    <div>
      <p class="text-xs text-gray-500 uppercase tracking-wide mb-2">Hoy</p>
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-gray-800 rounded-xl p-3 text-center">
          <p class="text-xl font-bold text-blue-400" x-text="metricas.pedidos_completados ?? '—'"></p>
          <p class="text-xs text-gray-500 mt-1" x-text="metricaLabel1"></p>
        </div>
        <div class="bg-gray-800 rounded-xl p-3 text-center">
          <p class="text-xl font-bold text-green-400"
             x-text="metricas.tiempo_medio_min ? metricas.tiempo_medio_min + 'm' : '—'"></p>
          <p class="text-xs text-gray-500 mt-1">T. medio</p>
        </div>
        <div class="bg-gray-800 rounded-xl p-3 text-center">
          <p class="text-xl font-bold text-amber-400" x-text="metricas.incidencias_hoy ?? '—'"></p>
          <p class="text-xs text-gray-500 mt-1" x-text="metricaLabel3"></p>
        </div>
      </div>
      <!-- Mi turno de hoy -->
      <div x-show="fichajeResumen && (fichajeResumen.activo || fichajeResumen.fin)" x-cloak
           class="mt-2 bg-gray-800 rounded-xl p-3 space-y-2">
        <div class="flex items-center justify-between">
          <p class="text-sm font-semibold text-white"
             x-text="formatHoraISO(fichajeResumen?.inicio) + (fichajeResumen?.fin ? ' → ' + formatHoraISO(fichajeResumen.fin) : ' → ahora')"></p>
          <span class="text-xs text-gray-400"
                x-text="formatMinutos(fichajeResumen?.duracion_total_min)"></span>
        </div>
        <template x-for="t in (fichajeResumen?.tramos || [])" :key="t.rol">
          <div class="flex items-center justify-between text-xs">
            <span class="text-gray-300" x-text="t.rol === 'picker' ? '📦 Picker' : '🛵 Repartidor'"></span>
            <span class="text-gray-400" x-text="formatMinutos(t.minutos)"></span>
          </div>
        </template>
        <div x-show="fichajeResumen?.activo" class="text-[11px] text-green-400 font-medium">● En curso</div>
      </div>
    </div>

    <!-- Accesos secundarios -->
    <div>
      <p class="text-xs text-gray-500 uppercase tracking-wide mb-2">Más</p>
      <div class="grid grid-cols-3 gap-2">
        <button class="bg-gray-800 rounded-xl p-3 text-center active:bg-gray-700 transition">
          <p class="text-xl">📊</p>
          <p class="text-xs text-gray-400 mt-1">Desempeño</p>
        </button>
        <a href="/empleado/turnos"
           class="bg-gray-800 rounded-xl p-3 text-center active:bg-gray-700 transition block">
          <p class="text-xl">🗓️</p>
          <p class="text-xs text-gray-400 mt-1">Turnos</p>
        </a>
        <template x-if="rol === 'repartidor'">
          <a href="/repartidor/cierre"
             class="bg-gray-800 rounded-xl p-3 text-center active:bg-gray-700 transition block">
            <p class="text-xl">🔒</p>
            <p class="text-xs text-gray-400 mt-1">Cierre</p>
          </a>
        </template>
        <template x-if="rol !== 'repartidor'">
          <button class="bg-gray-800 rounded-xl p-3 text-center active:bg-gray-700 transition">
            <p class="text-xl">ℹ️</p>
            <p class="text-xs text-gray-400 mt-1">Empresa</p>
          </button>
        </template>
      </div>
    </div>

    <!-- Cerrar sesión -->
    <form action="/auth/logout" method="post">
      <button type="submit"
              class="w-full rounded-xl border border-gray-800 bg-gray-900 px-4 py-3 text-sm font-semibold text-gray-500 transition active:bg-gray-800">
        Cerrar sesión
      </button>
    </form>

    <!-- Modal bloqueo de cambio de rol -->
    <div x-show="mostrarModalBloqueo" x-cloak
         class="fixed inset-0 bg-black/70 z-50 flex items-end justify-center p-4">
      <div class="bg-gray-900 rounded-2xl w-full max-w-md p-5 border border-red-900">
        <p class="text-red-400 font-bold text-sm mb-2">🔒 No puedes cambiar de rol ahora</p>
        <p class="text-gray-400 text-xs mb-3">
          Tienes tareas activas. Termínalas primero:
        </p>
        <div class="space-y-2 mb-4">
          <template x-for="p in pedidosBloqueantes" :key="p.id">
            <div class="bg-gray-800 rounded-lg px-3 py-2 flex justify-between">
              <span class="text-sm text-red-300 font-medium" x-text="p.tipo + ' #' + p.id"></span>
              <span class="text-xs text-gray-500" x-text="p.estado"></span>
            </div>
          </template>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <a :href="appUrl"
             class="bg-blue-700 text-white text-sm font-semibold rounded-xl py-2.5 text-center active:opacity-90">
            Ir a terminarlos
          </a>
          <button @click="mostrarModalBloqueo = false"
                  class="bg-gray-700 text-gray-300 text-sm rounded-xl py-2.5 active:bg-gray-600">
            Cancelar
          </button>
        </div>
        <p class="text-center text-gray-600 text-xs mt-3">El manager puede transferir los pedidos desde el dashboard</p>
      </div>
    </div>

  </main>

  <!-- ======== ALPINE COMPONENT ======== -->
  <script>
  function empleadoHub(empleadoId, rol) {
    return {
      empleadoId,
      rol,
      perfil:          { estado_operativo: 'desconectado' },
      turno:           null,
      metricas:        {},
      pedidosAsignados: 0,
      capacidades:         [],
      mostrarModalBloqueo: false,
      pedidosBloqueantes:  [],
      fichajeActivo: false,
      fichajeInicio: null,
      fichajeResumen: null,
      puedeIniciarTurno: false,
      razonNoIniciar: null,

      // -- computed --
      get saludo() {
        const h = new Date().getHours();
        if (h < 13) return 'Buenos días ☀️';
        if (h < 20) return 'Buenas tardes 🌤️';
        return 'Buenas noches 🌙';
      },
      get fechaHoy() {
        return new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
      },
      get nombreCompleto() { return this.perfil.nombre || ''; },
      get rolLabel() {
        return { picker: 'Picker', repartidor: 'Repartidor', manager: 'Manager', admin: 'Admin' }[this.rol] || this.rol;
      },
      get estadoLabel() {
        return { disponible: 'Disponible', ocupado: 'Ocupado', en_pausa: 'En pausa', desconectado: 'Desconectado' }[this.perfil.estado_operativo] || this.perfil.estado_operativo;
      },
      get estadoColor() {
        return { disponible: 'text-green-400', ocupado: 'text-amber-400', en_pausa: 'text-purple-400', desconectado: 'text-gray-400' }[this.perfil.estado_operativo] || 'text-gray-400';
      },
      get estadoBg() {
        return { disponible: 'bg-green-950 border-green-900', ocupado: 'bg-amber-950 border-amber-900', en_pausa: 'bg-purple-950 border-purple-900', desconectado: 'bg-gray-800 border-gray-700' }[this.perfil.estado_operativo] || 'bg-gray-800 border-gray-700';
      },
      get appUrl()          { return this.rol === 'repartidor' ? '/repartidor' : '/picker'; },
      get appLabel()        { return this.rol === 'repartidor' ? '🛵 App Reparto' : '🛒 App Picking'; },
      get appGradient()     { return this.rol === 'repartidor' ? 'bg-gradient-to-r from-orange-600 to-orange-700' : 'bg-gradient-to-r from-blue-600 to-blue-700'; },
      get appSubtitleColor(){ return this.rol === 'repartidor' ? 'text-orange-200' : 'text-blue-200'; },
      get appBtnColor()     { return this.rol === 'repartidor' ? 'text-orange-600' : 'text-blue-600'; },
      get metricaLabel1()   { return this.rol === 'repartidor' ? 'Entregas' : 'Pedidos'; },
      get metricaLabel3()   { return this.rol === 'repartidor' ? 'Fallidas' : 'Incidencias'; },
      get rolOpuesto()    { return this.rol === 'picker' ? 'Repartidor' : 'Picker'; },
      get rolOpuestoSlug(){ return this.rol === 'picker' ? 'repartidor' : 'picker'; },

      // -- methods --
      async init() {
        await Promise.all([this.cargarPerfil(), this.cargarTurno(), this.cargarMetricas(), this.cargarCapacidades(), this.cargarFichaje(), this.cargarPuedeIniciar()]);
        setInterval(() => this.cargarPuedeIniciar(), 60000);
      },

      async cargarPerfil() {
        try {
          const r = await fetch('/empleado/perfil');
          if (r.ok) this.perfil = await r.json();
        } catch (_) {}
      },

      async cargarTurno() {
        try {
          const r = await fetch('/empleado/turno-hoy');
          if (r.ok) this.turno = await r.json();
        } catch (_) {}
      },

      async cargarMetricas() {
        try {
          const r = await fetch('/empleado/metricas');
          if (r.ok) {
            const d = await r.json();
            this.metricas = d;
            this.pedidosAsignados = d.pedidos_activos || 0;
          }
        } catch (_) {}
      },

      async cargarCapacidades() {
        try {
          const r = await fetch('/empleado/capacidades');
          if (r.ok) {
            const d = await r.json();
            this.capacidades = d.capacidades || [];
          }
        } catch (_) {}
      },

      async cambiarRol() {
        const nuevoRol = this.rolOpuestoSlug;
        try {
          const r = await fetch('/empleado/cambiar-rol', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rol: nuevoRol }),
          });
          if (r.ok) {
            window.location.reload();
          } else if (r.status === 409) {
            const d = await r.json();
            this.pedidosBloqueantes = d.pedidos_activos || [];
            this.mostrarModalBloqueo = true;
          } else {
            const d = await r.json();
            alert(d.error || 'Error al cambiar rol');
          }
        } catch (_) {
          alert('Error de conexión');
        }
      },

      async cargarFichaje() {
        try {
          const r = await fetch('/empleado/fichaje/hoy');
          if (r.ok) {
            const d = await r.json();
            this.fichajeActivo = d.activo || false;
            this.fichajeInicio = d.inicio || null;
            this.fichajeResumen = d;
          }
        } catch (_) {}
      },

      async cargarPuedeIniciar() {
        try {
          const res = await fetch('/empleado/puede-iniciar');
          if (res.ok) {
            const data = await res.json();
            this.puedeIniciarTurno = data.puede;
            this.razonNoIniciar = data.razon;
          } else {
            this.puedeIniciarTurno = false;
            this.razonNoIniciar = 'Error al verificar';
          }
        } catch {
          this.puedeIniciarTurno = false;
          this.razonNoIniciar = 'Error al verificar';
        }
      },

      async iniciarTurno() {
        try {
          const r = await fetch('/empleado/fichaje', { method: 'POST' });
          if (r.ok) {
            await this.cargarFichaje();
          } else {
            const d = await r.json();
            alert(d.error || 'Error al iniciar turno');
          }
        } catch (_) { alert('Error de conexión'); }
      },

      async cerrarTurno() {
        if (!confirm('¿Cerrar el turno ahora?')) return;
        try {
          const r = await fetch('/empleado/fichaje/cerrar', { method: 'POST' });
          if (r.ok) {
            await this.cargarFichaje();
          } else {
            const d = await r.json();
            alert(d.error || 'Error al cerrar turno');
          }
        } catch (_) { alert('Error de conexión'); }
      },

      formatMinutos(min) {
        if (!min) return '0 min';
        const h = Math.floor(min / 60);
        const m = min % 60;
        if (h === 0) return m + ' min';
        if (m === 0) return h + 'h';
        return h + 'h ' + m + 'min';
      },

      formatHoraISO(iso) {
        if (!iso) return '';
        const s = iso.endsWith('Z') || iso.includes('+') ? iso : iso + 'Z';
        return new Date(s).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      },

      async cambiarEstado(nuevoEstado) {
        if (this.perfil.estado_operativo === 'ocupado') return;
        try {
          const r = await fetch('/empleado/estado', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ estado: nuevoEstado }),
          });
          if (r.ok) this.perfil.estado_operativo = nuevoEstado;
        } catch (_) {}
      },
    };
  }
  </script>

</body>
</html>
