<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Panchi — Mi zona</title>
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi zona">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    button { -webkit-tap-highlight-color: transparent; }

    body {
      background-color: #0f172a;
      color: #ffffff;
    }

    /* Header glow animación */
    @keyframes headerGlow {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.4; }
    }
    .header-glow {
      animation: headerGlow 3s ease-in-out infinite;
    }

    /* CTA Button animación */
    @keyframes ctaPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
      50% { transform: scale(1.01); box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
    }
    .cta-button {
      animation: ctaPulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .cta-button:active {
      animation: none;
      transform: scale(0.98);
    }

    /* Smooth transitions */
    * {
      transition: opacity 0.2s, transform 0.2s;
    }

    /* Scroll smooth */
    html { scroll-behavior: smooth; }

    .panchi-shimmer {
      background: linear-gradient(90deg, #60a5fa, #3b82f6, #60a5fa);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
  </style>
</head>
<body class="min-h-screen"
      x-data="empleadoHub({{ empleado_id or 'null' }}, '{{ rol or '' }}', '{{ app_mode or 'warehouse' }}')"
      x-init="init()">

  <!-- ======== HEADER ======== -->
  <header class="px-3 pt-3 pb-1 flex justify-center">
  <div class="bg-gray-800 border border-gray-700 rounded-2xl text-white shadow-sm overflow-hidden relative max-w-md w-full">

    <!-- Arte CSS: skyline + glow -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
      <!-- Gradiente azul pulsante -->
      <div class="header-glow absolute right-0 inset-y-0 w-32 bg-gradient-to-l from-blue-500/20 to-transparent"></div>
      <!-- Skyline minimalista -->
      <div style="position:absolute;bottom:0;right:10px;display:flex;align-items:flex-end;gap:2px;opacity:0.45">
        <!-- B1 -->
        <div style="width:9px;height:22px;background:#0f172a;border-radius:2px 2px 0 0;position:relative">
          <div style="position:absolute;top:4px;left:2px;width:2px;height:2px;background:#3b82f6;border-radius:1px;box-shadow:0 0 5px 3px rgba(59,130,246,0.55)"></div>
        </div>
        <!-- B2 -->
        <div style="width:14px;height:38px;background:#0f172a;border-radius:2px 2px 0 0;position:relative">
          <div style="position:absolute;top:5px;left:2px;width:3px;height:2px;background:#3b82f6;border-radius:1px;box-shadow:0 0 6px 3px rgba(59,130,246,0.5)"></div>
          <div style="position:absolute;top:5px;right:2px;width:3px;height:2px;background:#3b82f6;border-radius:1px;box-shadow:0 0 6px 3px rgba(59,130,246,0.5)"></div>
          <div style="position:absolute;top:13px;left:2px;width:3px;height:2px;background:#2563eb;border-radius:1px;box-shadow:0 0 5px 2px rgba(37,99,235,0.4)"></div>
        </div>
        <!-- B3 -->
        <div style="width:8px;height:28px;background:#0f172a;border-radius:2px 2px 0 0;position:relative">
        </div>
        <!-- B4 tall -->
        <div style="width:11px;height:50px;background:#0f172a;border-radius:2px 2px 0 0;position:relative">
          <div style="position:absolute;top:6px;left:2px;width:3px;height:2px;background:#3b82f6;border-radius:1px;box-shadow:0 0 7px 3px rgba(59,130,246,0.6)"></div>
          <div style="position:absolute;top:6px;right:2px;width:3px;height:2px;background:#3b82f6;border-radius:1px;box-shadow:0 0 7px 3px rgba(59,130,246,0.6)"></div>
          <div style="position:absolute;top:16px;left:2px;width:3px;height:2px;background:#2563eb;border-radius:1px;box-shadow:0 0 5px 2px rgba(37,99,235,0.35)"></div>
          <div style="position:absolute;top:26px;right:2px;width:3px;height:2px;background:#3b82f6;border-radius:1px;box-shadow:0 0 6px 3px rgba(59,130,246,0.5)"></div>
        </div>
        <!-- B5 -->
        <div style="width:16px;height:32px;background:#0f172a;border-radius:2px 2px 0 0;position:relative">
          <div style="position:absolute;top:5px;left:3px;width:3px;height:2px;background:#3b82f6;border-radius:1px;box-shadow:0 0 6px 3px rgba(59,130,246,0.55)"></div>
          <div style="position:absolute;top:5px;right:3px;width:3px;height:2px;background:#3b82f6;border-radius:1px;box-shadow:0 0 6px 3px rgba(59,130,246,0.55)"></div>
          <div style="position:absolute;top:14px;left:3px;width:3px;height:2px;background:#2563eb;border-radius:1px;box-shadow:0 0 5px 2px rgba(37,99,235,0.4)"></div>
        </div>
        <!-- B6 -->
        <div style="width:9px;height:42px;background:#0f172a;border-radius:2px 2px 0 0;position:relative">
          <div style="position:absolute;top:7px;left:2px;width:4px;height:2px;background:#3b82f6;border-radius:1px;box-shadow:0 0 8px 4px rgba(59,130,246,0.6)"></div>
          <div style="position:absolute;top:18px;left:2px;width:4px;height:2px;background:#3b82f6;border-radius:1px;box-shadow:0 0 6px 3px rgba(59,130,246,0.45)"></div>
        </div>
        <!-- B7 short -->
        <div style="width:12px;height:18px;background:#0f172a;border-radius:2px 2px 0 0"></div>
      </div>
    </div>

    <!-- Contenido del header -->
    <div class="relative flex items-center justify-start px-4 py-3">
      <!-- Izquierda: título -->
      <div>
        <p class="panchi-shimmer text-[11px] font-semibold uppercase tracking-[0.18em] leading-none mb-0.5">Panchi</p>
        <p class="text-base font-black text-white leading-none tracking-tight" x-text="nombreCompleto || 'Mi zona'"></p>
      </div>
    </div>

  </div>
  </header>

  <!-- ======== CONTENIDO ======== -->
  <main class="max-w-md mx-auto px-3 py-5 pb-24 space-y-4">

    <!-- Turno de hoy + fichaje (compacto) -->
    <div class="bg-gray-800/50 border border-gray-700 rounded-2xl p-3.5 backdrop-blur">
      <template x-if="turno">
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-xs text-gray-400 uppercase tracking-wide font-medium">Turno hoy</p>
              <p class="text-white font-bold text-sm mt-1"
                 x-text="turno.hora_inicio + ' – ' + turno.hora_fin"></p>
            </div>
            <!-- Fichaje button aquí arriba, más visible -->
            <div class="flex flex-col items-end gap-1">
              <div x-show="!fichajeActivo" class="flex flex-col items-center">
                <button @click="iniciarTurno()"
                        :disabled="!puedeIniciarTurno"
                        :class="puedeIniciarTurno
                          ? 'bg-green-600 text-white active:bg-green-700 shadow-lg'
                          : 'bg-gray-700 text-gray-500 cursor-not-allowed opacity-50'"
                        class="text-xs px-3 py-1.5 rounded-lg font-semibold transition-all">
                  ▶ Iniciar
                </button>
              </div>
              <button x-show="fichajeActivo"
                      @click="cerrarTurno()"
                      class="bg-red-900/30 text-red-400 text-xs px-3 py-1.5 rounded-lg transition active:bg-red-900/50">
                ⏹ Cerrar
              </button>
            </div>
          </div>
          <p x-show="fichajeActivo && fichajeInicio" x-cloak
             class="text-xs text-green-400 font-medium"
             x-text="'En curso desde las ' + formatHoraISO(fichajeInicio)"></p>
          <p x-show="turno.notas" x-cloak class="text-gray-500 text-xs" x-text="turno.notas"></p>
        </div>
      </template>
      <template x-if="!turno">
        <div class="flex items-start gap-3">
          <span class="text-2xl mt-0.5">🗓️</span>
          <div>
            <p class="text-gray-300 text-sm font-medium">Sin turno registrado</p>
            <p class="text-gray-500 text-xs mt-0.5">El manager lo asignará pronto</p>
          </div>
        </div>
      </template>
    </div>

    <!-- CTA principal — DESTACADO Y GRANDE -->
    <a :href="appUrl"
       class="cta-button block rounded-2xl px-5 py-0.5 text-center active:shadow-inner transition-all"
       :class="appGradient">
      <div class="relative">
        <p class="text-lg font-black text-white mb-1" x-text="appLabel"></p>
        <div class="flex items-center justify-center gap-1 mb-1">
          <span class="text-lg">
            <template x-if="rol === 'repartidor'">🛵</template>
            <template x-if="rol === 'picker'">📦</template>
            <template x-if="appMode === 'restaurant' && rol !== 'repartidor'">👨‍🍳</template>
          </span>
        </div>
        <div class="bg-white/20 backdrop-blur rounded-xl py-1.5 px-3 inline-block">
          <p class="text-white font-bold text-base">Entrar →</p>
        </div>
      </div>
    </a>

    <!-- Colas globales (info rápida) -->
    <div>
      <p class="text-xs text-gray-500 uppercase tracking-wide font-medium mb-2.5">Colas ahora</p>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-gray-800/40 border border-gray-700/50 rounded-xl p-3 flex items-center justify-between backdrop-blur">
          <div>
            <p class="text-xs text-gray-400" x-text="appMode === 'restaurant' ? 'Sin cocinero' : 'Sin picker'"></p>
            <p class="text-lg font-bold mt-1"
               :class="metricas.sin_picker > 0 ? 'text-amber-400' : 'text-gray-600'"
               x-text="metricas.sin_picker ?? '—'"></p>
          </div>
          <span class="text-2xl opacity-70">📦</span>
        </div>
        <div class="bg-gray-800/40 border border-gray-700/50 rounded-xl p-3 flex items-center justify-between backdrop-blur">
          <div>
            <p class="text-xs text-gray-400">Sin repartidor</p>
            <p class="text-lg font-bold mt-1"
               :class="metricas.sin_repartidor > 0 ? 'text-orange-400' : 'text-gray-600'"
               x-text="metricas.sin_repartidor ?? '—'"></p>
          </div>
          <span class="text-2xl opacity-70">🛵</span>
        </div>
      </div>
    </div>

    <!-- Cambiar rol — solo visible si polivalente -->
    <template x-if="capacidades.length > 1">
      <button @click="cambiarRol()"
              class="w-full rounded-xl border px-4 py-3 text-sm font-semibold transition active:opacity-70"
              :class="rol === 'repartidor'
                ? 'border-blue-700 bg-blue-950/40 text-blue-300 hover:bg-blue-950/60'
                : 'border-orange-700 bg-orange-950/40 text-orange-300 hover:bg-orange-950/60'">
        ⇄ Cambiar a <span x-text="rolOpuesto"></span>
      </button>
    </template>

    <!-- Stats del día -->
    <div>
      <p class="text-xs text-gray-500 uppercase tracking-wide font-medium mb-1.5">Hoy</p>
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-gray-800/40 border border-gray-700/50 rounded-xl py-2 px-1 text-center backdrop-blur">
          <p class="text-lg font-bold text-blue-400 leading-none" x-text="metricas.pedidos_completados ?? '—'"></p>
          <p class="text-[10px] text-gray-400 mt-1" x-text="metricaLabel1"></p>
        </div>
        <div class="bg-gray-800/40 border border-gray-700/50 rounded-xl py-2 px-1 text-center backdrop-blur">
          <p class="text-lg font-bold text-green-400 leading-none"
             x-text="metricas.tiempo_medio_min ? metricas.tiempo_medio_min + 'm' : '—'"></p>
          <p class="text-[10px] text-gray-400 mt-1">T. medio</p>
        </div>
        <div class="bg-gray-800/40 border border-gray-700/50 rounded-xl py-2 px-1 text-center backdrop-blur">
          <p class="text-lg font-bold text-amber-400 leading-none" x-text="metricas.incidencias_hoy ?? '—'"></p>
          <p class="text-[10px] text-gray-400 mt-1" x-text="metricaLabel3"></p>
        </div>
      </div>
      <!-- Fichaje detail -->
      <div x-show="fichajeResumen && (fichajeResumen.activo || fichajeResumen.fin)" x-cloak
           class="mt-2 bg-gray-800/30 border border-gray-700/40 rounded-xl px-3 py-2 space-y-1 backdrop-blur">
        <div class="flex items-center justify-between">
          <p class="text-xs text-gray-300"
             x-text="formatHoraISO(fichajeResumen?.inicio) + (fichajeResumen?.fin ? ' → ' + formatHoraISO(fichajeResumen.fin) : ' → ahora')"></p>
          <span class="text-xs text-gray-500" x-text="formatMinutos(fichajeResumen?.duracion_total_min)"></span>
        </div>
        <template x-for="t in (fichajeResumen?.tramos || [])" :key="t.rol">
          <div class="flex items-center justify-between text-xs">
            <span class="text-gray-400" x-text="t.rol === 'picker' ? '📦 Picker' : '🛵 Repartidor'"></span>
            <span class="text-gray-500" x-text="formatMinutos(t.minutos)"></span>
          </div>
        </template>
        <div x-show="fichajeResumen?.activo" class="text-xs text-green-400 font-semibold">● En curso</div>
      </div>
    </div>

    <!-- Accesos secundarios -->
    <div>
      <p class="text-xs text-gray-500 uppercase tracking-wide font-medium mb-1.5">Más</p>
      <div class="grid grid-cols-3 gap-2">
        <button class="bg-gray-800/40 border border-gray-700/50 rounded-xl py-2 px-1 text-center active:bg-gray-700/50 transition backdrop-blur">
          <p class="text-lg mb-1">📊</p>
          <p class="text-[10px] text-gray-400">Desempeño</p>
        </button>
        <a href="/empleado/turnos"
           class="bg-gray-800/40 border border-gray-700/50 rounded-xl py-2 px-1 text-center active:bg-gray-700/50 transition backdrop-blur block">
          <p class="text-lg mb-1">🗓️</p>
          <p class="text-[10px] text-gray-400">Turnos</p>
        </a>
        <template x-if="rol === 'repartidor'">
          <a href="/repartidor/cierre"
             class="bg-gray-800/40 border border-gray-700/50 rounded-xl py-2 px-1 text-center active:bg-gray-700/50 transition backdrop-blur block">
            <p class="text-lg mb-1">🔒</p>
            <p class="text-[10px] text-gray-400">Cierre</p>
          </a>
        </template>
        <template x-if="rol !== 'repartidor'">
          <button class="bg-gray-800/40 border border-gray-700/50 rounded-xl py-2 px-1 text-center active:bg-gray-700/50 transition backdrop-blur">
            <p class="text-lg mb-1">ℹ️</p>
            <p class="text-[10px] text-gray-400">Empresa</p>
          </button>
        </template>
      </div>
    </div>

    <!-- Cerrar sesión -->
    <form action="/auth/logout" method="post">
      <button type="submit"
              class="w-full rounded-xl border border-gray-700/50 bg-gray-800/20 px-4 py-3 text-sm font-semibold text-gray-400 transition active:bg-gray-700/40 backdrop-blur">
        Cerrar sesión
      </button>
    </form>

    <!-- Modal bloqueo de cambio de rol -->
    <div x-show="mostrarModalBloqueo" x-cloak
         class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center p-4 pb-6">
      <div class="bg-gray-800 rounded-3xl w-full max-w-md p-6 border border-red-900/50 shadow-2xl">
        <div class="flex items-start gap-3 mb-3">
          <span class="text-3xl">🔒</span>
          <div>
            <p class="text-red-400 font-bold text-base">No puedes cambiar ahora</p>
            <p class="text-gray-400 text-xs mt-0.5">
              Tienes tareas activas. Termínalas primero:
            </p>
          </div>
        </div>
        <div class="space-y-2 mb-5">
          <template x-for="p in pedidosBloqueantes" :key="p.id">
            <div class="bg-gray-700/50 rounded-lg px-4 py-2.5 flex justify-between border border-gray-600/30">
              <span class="text-sm text-red-300 font-semibold" x-text="p.tipo + ' #' + p.id"></span>
              <span class="text-xs text-gray-500 font-medium" x-text="p.estado"></span>
            </div>
          </template>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-3">
          <a :href="appUrl"
             class="bg-blue-600 text-white text-sm font-bold rounded-xl py-3 text-center active:bg-blue-700 transition">
            Ir a terminarlos
          </a>
          <button @click="mostrarModalBloqueo = false"
                  class="bg-gray-700/50 text-gray-300 text-sm font-semibold rounded-xl py-3 active:bg-gray-600 transition">
            Cancelar
          </button>
        </div>
        <p class="text-center text-gray-500 text-xs">El manager puede transferir desde el dashboard</p>
      </div>
    </div>

  </main>

  <!-- ======== ALPINE COMPONENT ======== -->
  <script>
  function empleadoHub(empleadoId, rol, appMode) {
    return {
      empleadoId,
      rol,
      appMode,
      perfil:          { estado_operativo: 'desconectado' },
      turno:           null,
      metricas:        {},
      pedidosAsignados: 0,
      capacidades:         [],
      mostrarModalBloqueo: false,
      pedidosBloqueantes:  [],
      fichajeActivo: false,
      fichajeInicio: null,
      fichajeResumen: null,
      puedeIniciarTurno: false,
      razonNoIniciar: null,

      // -- computed --
      get saludo() {
        const h = new Date().getHours();
        if (h < 13) return 'Buenos días ☀️';
        if (h < 20) return 'Buenas tardes 🌤️';
        return 'Buenas noches 🌙';
      },
      get fechaHoy() {
        return new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
      },
      get nombreCompleto() { return this.perfil.nombre || ''; },
      get rolLabel() {
        return { picker: 'Picker', repartidor: 'Repartidor', manager: 'Manager', admin: 'Admin' }[this.rol] || this.rol;
      },
      get estadoLabel() {
        return { disponible: 'Disponible', ocupado: 'Ocupado', en_pausa: 'En pausa', desconectado: 'Desconectado' }[this.perfil.estado_operativo] || this.perfil.estado_operativo;
      },
      get estadoColor() {
        return { disponible: 'text-green-400', ocupado: 'text-amber-400', en_pausa: 'text-purple-400', desconectado: 'text-gray-400' }[this.perfil.estado_operativo] || 'text-gray-400';
      },
      get estadoBg() {
        return { disponible: 'bg-green-950 border-green-900', ocupado: 'bg-amber-950 border-amber-900', en_pausa: 'bg-purple-950 border-purple-900', desconectado: 'bg-gray-800 border-gray-700' }[this.perfil.estado_operativo] || 'bg-gray-800 border-gray-700';
      },
      get appUrl()          { return this.rol === 'repartidor' ? '/repartidor' : (this.appMode === 'restaurant' ? '/cocina' : '/picker'); },
      get appLabel()        { return this.rol === 'repartidor' ? '🛵 App Reparto' : (this.appMode === 'restaurant' ? '👨‍🍳 App Cocina' : '🛒 App Picking'); },
      get appGradient()     { return this.rol === 'repartidor' ? 'bg-gradient-to-r from-orange-600 to-orange-700' : 'bg-gradient-to-r from-blue-600 to-blue-700'; },
      get appSubtitleColor(){ return this.rol === 'repartidor' ? 'text-orange-200' : 'text-blue-200'; },
      get appBtnColor()     { return this.rol === 'repartidor' ? 'text-orange-600' : 'text-blue-600'; },
      get metricaLabel1()   { return this.rol === 'repartidor' ? 'Entregas' : 'Pedidos'; },
      get metricaLabel3()   { return this.rol === 'repartidor' ? 'Fallidas' : 'Incidencias'; },
      get rolOpuesto()    { return this.rol === 'picker' ? 'Repartidor' : 'Picker'; },
      get rolOpuestoSlug(){ return this.rol === 'picker' ? 'repartidor' : 'picker'; },

      // -- methods --
      async init() {
        await Promise.all([this.cargarPerfil(), this.cargarTurno(), this.cargarMetricas(), this.cargarCapacidades(), this.cargarFichaje(), this.cargarPuedeIniciar()]);
        setInterval(() => this.cargarPuedeIniciar(), 60000);
      },

      async cargarPerfil() {
        try {
          const r = await fetch('/empleado/perfil');
          if (r.ok) this.perfil = await r.json();
        } catch (_) {}
      },

      async cargarTurno() {
        try {
          const r = await fetch('/empleado/turno-hoy');
          if (r.ok) this.turno = await r.json();
        } catch (_) {}
      },

      async cargarMetricas() {
        try {
          const r = await fetch('/empleado/metricas');
          if (r.ok) {
            const d = await r.json();
            this.metricas = d;
            this.pedidosAsignados = d.pedidos_activos || 0;
          }
        } catch (_) {}
      },

      async cargarCapacidades() {
        try {
          const r = await fetch('/empleado/capacidades');
          if (r.ok) {
            const d = await r.json();
            this.capacidades = d.capacidades || [];
          }
        } catch (_) {}
      },

      async cambiarRol() {
        const nuevoRol = this.rolOpuestoSlug;
        try {
          const r = await fetch('/empleado/cambiar-rol', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rol: nuevoRol }),
          });
          if (r.ok) {
            window.location.reload();
          } else if (r.status === 409) {
            const d = await r.json();
            this.pedidosBloqueantes = d.pedidos_activos || [];
            this.mostrarModalBloqueo = true;
          } else {
            const d = await r.json();
            alert(d.error || 'Error al cambiar rol');
          }
        } catch (_) {
          alert('Error de conexión');
        }
      },

      async cargarFichaje() {
        try {
          const r = await fetch('/empleado/fichaje/hoy');
          if (r.ok) {
            const d = await r.json();
            this.fichajeActivo = d.activo || false;
            this.fichajeInicio = d.inicio || null;
            this.fichajeResumen = d;
          }
        } catch (_) {}
      },

      async cargarPuedeIniciar() {
        try {
          const res = await fetch('/empleado/puede-iniciar');
          if (res.ok) {
            const data = await res.json();
            this.puedeIniciarTurno = data.puede;
            this.razonNoIniciar = data.razon;
          } else {
            this.puedeIniciarTurno = false;
            this.razonNoIniciar = 'Error al verificar';
          }
        } catch {
          this.puedeIniciarTurno = false;
          this.razonNoIniciar = 'Error al verificar';
        }
      },

      async iniciarTurno() {
        try {
          const r = await fetch('/empleado/fichaje', { method: 'POST' });
          if (r.ok) {
            await this.cargarFichaje();
          } else {
            const d = await r.json();
            alert(d.error || 'Error al iniciar turno');
          }
        } catch (_) { alert('Error de conexión'); }
      },

      async cerrarTurno() {
        if (!confirm('¿Cerrar el turno ahora?')) return;
        try {
          const r = await fetch('/empleado/fichaje/cerrar', { method: 'POST' });
          if (r.ok) {
            await this.cargarFichaje();
          } else {
            const d = await r.json();
            alert(d.error || 'Error al cerrar turno');
          }
        } catch (_) { alert('Error de conexión'); }
      },

      formatMinutos(min) {
        if (!min) return '0 min';
        const h = Math.floor(min / 60);
        const m = min % 60;
        if (h === 0) return m + ' min';
        if (m === 0) return h + 'h';
        return h + 'h ' + m + 'min';
      },

      formatHoraISO(iso) {
        if (!iso) return '';
        const s = iso.endsWith('Z') || iso.includes('+') ? iso : iso + 'Z';
        return new Date(s).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      },

      async cambiarEstado(nuevoEstado) {
        if (this.perfil.estado_operativo === 'ocupado') return;
        try {
          const r = await fetch('/empleado/estado', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ estado: nuevoEstado }),
          });
          if (r.ok) this.perfil.estado_operativo = nuevoEstado;
        } catch (_) {}
      },
    };
  }
  </script>
