<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área de Picking - Simulación</title>
  <style>
    /* Estilos generales */
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
      background-color: #fff;
      min-height: 100vh;
    }
    h1, h2 {
      text-align: center;
    }
    /* Estilo para cada item de pedido y producto */
    .order-item, .product-item {
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
    }
    .order-item:hover {
      background-color: #f0f0f0;
      cursor: pointer;
    }
    /* Botones */
    .btn {
      display: inline-block;
      padding: 8px 12px;
      margin: 5px 0;
      border: none;
      border-radius: 4px;
      background-color: #007BFF;
      color: white;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }
    .btn-success {
      background-color: #28a745;
    }
    .btn-warning {
      background-color: #ffc107;
      color: #000;
    }
    .back-link {
      margin-top: 20px;
      display: block;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sección: Lista de Pedidos -->
    <div id="ordersListSection">
      <h1>Pedidos Pendientes</h1>
      <div id="ordersList"></div>
    </div>

    <!-- Sección: Detalle del Pedido -->
    <div id="orderDetailsSection" style="display: none;">
      <h1>Detalle del Pedido</h1>
      <div id="orderDetails"></div>
      <a href="#" id="backToList" class="back-link">← Volver a la lista de pedidos</a>
    </div>
  </div>

  <script>
    let sampleOrders = [
      {
        id: 1,
        createdAt: "2025-03-14 08:30",
        status: "pending",
        products: [
          { id: 101, name: "Producto A", quantity: 2, location: "Estante 1", picked: false },
          { id: 102, name: "Producto B", quantity: 1, location: "Estante 3", picked: false }
        ]
      },
      {
        id: 2,
        createdAt: "2025-03-14 09:15",
        status: "pending",
        products: [
          { id: 103, name: "Producto C", quantity: 3, location: "Estante 2", picked: false },
          { id: 104, name: "Producto D", quantity: 2, location: "Estante 4", picked: false }
        ]
      }
    ];

    function loadOrders() {
      const ordersList = document.getElementById('ordersList');
      ordersList.innerHTML = '';
      sampleOrders.forEach(order => {
        const orderDiv = document.createElement('div');
        orderDiv.className = 'order-item';
        orderDiv.innerHTML = `<strong>Pedido #${order.id}</strong> - ${order.createdAt}`;
        orderDiv.addEventListener('click', () => loadOrderDetails(order.id));
        ordersList.appendChild(orderDiv);
      });
    }

    function loadOrderDetails(orderId) {
      document.getElementById('ordersListSection').style.display = 'none';
      document.getElementById('orderDetailsSection').style.display = 'block';
      const order = sampleOrders.find(o => o.id == orderId);
      const orderDetails = document.getElementById('orderDetails');
      orderDetails.innerHTML = `<p><strong>ID:</strong> ${order.id}</p>
                                <p><strong>Fecha de Creación:</strong> ${order.createdAt}</p>
                                <p><strong>Estado:</strong> ${order.status}</p>`;
      order.products.forEach(product => {
        const productDiv = document.createElement('div');
        productDiv.className = 'product-item';
        productDiv.innerHTML = `<p><strong>${product.name}</strong></p>
                                <p>Cantidad: ${product.quantity}</p>
                                <p>Ubicación: ${product.location}</p>
                                <p>Estado: ${product.picked ? 'Recogido' : 'Pendiente'}</p>`;
        if (!product.picked) {
          const pickBtn = document.createElement('button');
          pickBtn.className = 'btn btn-success';
          pickBtn.textContent = 'Marcar como recogido';
          pickBtn.addEventListener('click', () => markProductAsPicked(order.id, product.id));
          productDiv.appendChild(pickBtn);
        }
        orderDetails.appendChild(productDiv);
      });
    }

    function markProductAsPicked(orderId, productId) {
      const order = sampleOrders.find(o => o.id == orderId);
      if (order) {
        const product = order.products.find(p => p.id == productId);
        if (product && !product.picked) {
          product.picked = true;
          loadOrderDetails(orderId);
        }
      }
    }

    document.getElementById('backToList').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('ordersListSection').style.display = 'block';
      document.getElementById('orderDetailsSection').style.display = 'none';
    });

    loadOrders();
  </script>
</body>
</html>
