# ─────────────────────────────────────────────────────────────
# nginx de producción DETRÁS de Cloudflare Tunnel.
# Cadena: Cloudflare (HTTPS) → túnel → cloudflared → 127.0.0.1:8081 → aquí (:80) → app:5000
# Sin SSL ni certbot: el HTTPS (y HSTS) lo pone Cloudflare.
# Única config de nginx: sirve igual en local (http://localhost:8081) y en el VPS.
# ─────────────────────────────────────────────────────────────

# IP real del visitante: Cloudflare la manda en CF-Connecting-IP.
# Solo se acepta si la conexión viene de la red de Docker (el túnel entra por el gateway).
set_real_ip_from 172.16.0.0/12;
real_ip_header   CF-Connecting-IP;

server_tokens off;

# Rate limit del login (anti fuerza bruta): 10 intentos/min por IP real del visitante.
# Funciona porque el bloque de arriba ya ha puesto la IP real del VISITANTE en $binary_remote_addr.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

# Cache-Control: no-store en todo menos /static/ → el navegador no guarda páginas con datos
# de sesión (dashboards, pedidos). Valor vacío = nginx no añade la cabecera.
map $uri $cache_control {
    ~^/static/  "";
    default     "no-store";
}

# panchibot.es (sin www) → https://www.panchibot.es
server {
    listen 80;
    server_name panchibot.es;
    return 301 https://www.panchibot.es$request_uri;
}

# Servidor principal (default_server: también responde al healthcheck por 127.0.0.1)
server {
    listen 80 default_server;
    server_name www.panchibot.es _;

    # ── Cabeceras de seguridad ──────────────────────────────
    # OJO: ninguna location puede tener add_header, o anularía todas estas.
    # CSP — Fase 1: Report-Only (avisa en consola, no bloquea). Inventario (nov 2026):
    #   scripts: Tailwind Play CDN, jsdelivr, unpkg (Leaflet) + 'unsafe-inline' (19 templates con <script> inline)
    #   estilos: Google Fonts + 'unsafe-inline' (Tailwind Play inyecta <style> en tiempo de ejecución)
    #   imágenes: tiles de Carto y OpenStreetMap · fetch: formspree.io · iframes: solo propios
    # Siguiente fase: sacar los <script> inline a .js → quitar 'unsafe-inline' de script-src.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://unpkg.com https://cdn.jsdelivr.net; connect-src 'self' https://formspree.io; frame-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://*.monei.com; object-src 'none'" always;
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options      "nosniff" always;
    add_header X-Frame-Options             "SAMEORIGIN" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # Contacto para quien encuentre una vulnerabilidad (RFC 9116).
    # Expires: obligatorio y a menos de 1 año vista → renovarlo.
    location = /.well-known/security.txt {
        default_type "text/plain; charset=utf-8";
        return 200 "Contact: mailto:jorgesiemprearmando@gmail.com\nExpires: 2027-11-01T00:00:00Z\nPreferred-Languages: es, en\n";
    }

    # archivos ocultos (.git, .env…) → 404, menos .well-known
    location ~ /\.(?!well-known) {
        return 404;
    }

    # login: rate limit (burst 5 = margen para quien se equivoca un par de veces)
    location = /auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://app:5000/health;
        access_log off;
    }

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host              $host;
        # $remote_addr ya es la IP real (realip). Se manda UN solo valor:
        # ProxyFix(x_for=1) en Flask toma el último → el del cliente, no el de Docker.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Solo se llega por el túnel, siempre HTTPS de cara al cliente
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
