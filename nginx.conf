# ─────────────────────────────────────────────────────────────
# nginx de producción DETRÁS de Cloudflare Tunnel.
# Cadena: Cloudflare (HTTPS) → túnel → cloudflared → 127.0.0.1:8081 → aquí (:80) → app:5000
# Sin SSL ni certbot: el HTTPS (y HSTS) lo pone Cloudflare.
# Única config de nginx: sirve igual en local (http://localhost:8081) y en el VPS.
# ─────────────────────────────────────────────────────────────

# IP real del visitante: Cloudflare la manda en CF-Connecting-IP.
# Solo se acepta si la conexión viene de la red de Docker (el túnel entra por el gateway).
set_real_ip_from 172.16.0.0/12;
real_ip_header   CF-Connecting-IP;

server_tokens off;

# panchibot.es (sin www) → https://www.panchibot.es
server {
    listen 80;
    server_name panchibot.es;
    return 301 https://www.panchibot.es$request_uri;
}

# Servidor principal (default_server: también responde al healthcheck por 127.0.0.1)
server {
    listen 80 default_server;
    server_name www.panchibot.es _;

    # ── Cabeceras de seguridad ──────────────────────────────
    # OJO: ninguna location puede tener add_header, o anularía todas estas.
    # CSP pendiente: hay scripts inline en templates → requiere auditoría aparte.
    add_header X-Content-Type-Options      "nosniff" always;
    add_header X-Frame-Options             "SAMEORIGIN" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # archivos ocultos (.git, .env…) → 404
    location ~ /\. {
        return 404;
    }

    location /health {
        proxy_pass http://app:5000/health;
        access_log off;
    }

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host              $host;
        # $remote_addr ya es la IP real (realip). Se manda UN solo valor:
        # ProxyFix(x_for=1) en Flask toma el último → el del cliente, no el de Docker.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Solo se llega por el túnel, siempre HTTPS de cara al cliente
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
